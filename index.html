<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWise Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* --- SUPPRESSION DU CARRÉ ORANGE ET STYLE TV --- */
        * { 
            -webkit-tap-highlight-color: transparent; 
            outline: none !important; 
        }

        body { 
            margin: 0; 
            background: #121212; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow-x: hidden; 
        }
        
        #menu { 
            padding: 20px; 
            text-align: center; 
        }

        h1 { 
            font-weight: 300; 
            margin-bottom: 30px; 
            letter-spacing: 2px;
        }

        /* La Grille de Matchs */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 25px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto;
        }

        /* Cartes des matchs */
        .card { 
            background: #1e1e1e; 
            border-radius: 15px; 
            padding: 20px; 
            transition: all 0.3s ease; 
            cursor: pointer; 
            border: 4px solid transparent;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Effet de sélection (Focus) - REMPLACE LE CARRÉ ORANGE */
        .card:focus { 
            transform: scale(1.1); 
            border-color: #e50914; 
            background: #252525; 
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }

        .card img { 
            width: 100px; 
            height: 100px; 
            object-fit: contain; 
            margin-bottom: 15px; 
            pointer-events: none; 
        }

        .card p { 
            margin: 0; 
            font-size: 16px; 
            font-weight: 500; 
            pointer-events: none; 
            text-align: center;
        }

        /* Lecteur plein écran caché */
        #player-container { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            z-index: 100; 
        }

        video { 
            width: 100%; 
            height: 100%; 
        }
        
        /* Bouton Retour propre */
        .back-btn {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 110;
            background: #e50914; 
            color: white; 
            border: none;
            padding: 12px 24px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .back-btn:focus {
            border: 2px solid white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Interface Principale -->
    <div id="menu">
        <h1>WEBWISE STREAM</h1>
        <div id="match-grid" class="grid">
            <!-- Le script va afficher "Chargement..." ou les erreurs ici -->
            <p>Chargement de la liste...</p>
        </div>
    </div>

    <!-- Conteneur du Lecteur (Vidéo ou Iframe) -->
    <div id="player-container">
        <!-- Le contenu est généré dynamiquement par script.js -->
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>

</body>
</html>
