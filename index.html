<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Play TV - Lecteur Premium</title>
    
    <!-- Importation de HLS.js pour la lecture des flux -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        /* Réinitialisation et style de base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Empêche le défilement sur TV */
        }

        /* Conteneur principal du lecteur */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Garde le ratio de l'image */
        }

        /* Barre de contrôles style Chrome/Netflix */
        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Afficher les contrôles au mouvement ou au focus */
        .video-container:hover .controls-overlay,
        .controls-overlay.active {
            opacity: 1;
        }

        /* Barre de progression */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #e50914; /* Accent rouge style moderne */
            border-radius: 3px;
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Boutons de contrôle */
        .buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            outline: none;
            padding: 10px;
            border-radius: 50%;
        }

        /* STYLE FOCUS POUR LA TÉLÉCOMMANDE ANDROID TV */
        button:focus, button.tv-focus {
            transform: scale(1.2);
            color: #e50914;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .time-display {
            font-size: 14px;
            font-weight: 500;
            user-select: none;
        }

        /* Notification de chargement/erreur */
        #status-message {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <div id="status-message">Chargement du flux...</div>
        <video id="tvPlayer" crossorigin="anonymous"></video>

        <div class="controls-overlay" id="controlsOverlay">
            <div class="progress-container" id="progressContainer" tabindex="0">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="buttons-row">
                <div class="left-controls">
                    <button id="playPauseBtn" tabindex="1">▶</button>
                    <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
                </div>
                
                <div class="right-controls">
                    <button id="muteBtn" tabindex="2">🔊</button>
                    <button id="fullscreenBtn" tabindex="3">⛶</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('tvPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const muteBtn = document.getElementById('muteBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const progressBar = document.getElementById('progressBar');
            const timeDisplay = document.getElementById('timeDisplay');
            const controlsOverlay = document.getElementById('controlsOverlay');
            const statusMessage = document.getElementById('status-message');
            
            // --- 1. CONFIGURATION DU FLUX (Remplace l'URL par ton lien JSON/M3U parsé si besoin) ---
            const streamUrl = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"; // URL de test

            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 30, // Optimisation pour TV
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    statusMessage.innerText = "";
                    video.play().catch(() => {
                        console.log("Autoplay bloqué par le navigateur.");
                    });
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        statusMessage.innerText = "Erreur de chargement du flux.";
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Support natif (Safari / certains navigateurs mobiles)
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                });
            }

            // --- 2. LOGIQUE DES CONTRÔLES VISUELS ---
            
            function togglePlay() {
                if (video.paused) {
                    video.play();
                    playPauseBtn.innerText = "⏸";
                } else {
                    video.pause();
                    playPauseBtn.innerText = "▶";
                }
            }

            function updateProgress() {
                if (!video.duration) return;
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.style.width = `${percent}%`;
                
                let currentMins = Math.floor(video.currentTime / 60);
                let currentSecs = Math.floor(video.currentTime % 60);
                let durationMins = Math.floor(video.duration / 60);
                let durationSecs = Math.floor(video.duration % 60);
                
                if (currentSecs < 10) currentSecs = "0" + currentSecs;
                if (durationSecs < 10) durationSecs = "0" + durationSecs;
                
                timeDisplay.innerText = `${currentMins}:${currentSecs} / ${durationMins}:${durationSecs}`;
            }

            function toggleMute() {
                video.muted = !video.muted;
                muteBtn.innerText = video.muted ? "🔇" : "🔊";
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }

            // Clics à la souris
            playPauseBtn.addEventListener('click', togglePlay);
            muteBtn.addEventListener('click', toggleMute);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            video.addEventListener('timeupdate', updateProgress);
            video.addEventListener('click', togglePlay);

            // Gestion de l'affichage de la barre de contrôle (disparaît après 3s d'inactivité)
            let hideControlsTimeout;
            function showControls() {
                controlsOverlay.classList.add('active');
                clearTimeout(hideControlsTimeout);
                hideControlsTimeout = setTimeout(() => {
                    controlsOverlay.classList.remove('active');
                }, 3000);
            }
            document.addEventListener('mousemove', showControls);
            document.addEventListener('keydown', showControls);

            // --- 3. NAVIGATION TÉLÉCOMMANDE (ANDROID TV) ---
            
            // On définit les éléments navigables
            const focusableElements = [playPauseBtn, muteBtn, fullscreenBtn];
            let currentFocusIndex = 0;
            
            // Focus initial
            focusableElements[currentFocusIndex].focus();

            document.addEventListener('keydown', (e) => {
                showControls(); // Fait apparaître l'interface à la moindre touche

                switch (e.key) {
                    case 'ArrowRight':
                        e.preventDefault();
                        // Navigation dans les boutons
                        currentFocusIndex = (currentFocusIndex + 1) % focusableElements.length;
                        focusableElements[currentFocusIndex].focus();
                        break;
                        
                    case 'ArrowLeft':
                        e.preventDefault();
                        currentFocusIndex = (currentFocusIndex - 1 + focusableElements.length) % focusableElements.length;
                        focusableElements[currentFocusIndex].focus();
                        break;
                        
                    case 'Enter':
                    case 'OK': // Certaines télécommandes envoient 'OK'
                        e.preventDefault();
                        document.activeElement.click(); // Clique sur l'élément focus
                        break;
                        
                    case 'MediaPlayPause': // Touche physique Play/Pause
                        e.preventDefault();
                        togglePlay();
                        break;

                    // Ajout pour avancer/reculer dans la vidéo (Optionnel)
                    case 'ArrowUp':
                        e.preventDefault();
                        video.currentTime = Math.min(video.currentTime + 30, video.duration); // Avance de 30s
                        break;
                        
                    case 'ArrowDown':
                        e.preventDefault();
                        video.currentTime = Math.max(video.currentTime - 30, 0); // Recule de 30s
                        break;
                }
            });
            
            // Fixer le focus initial au démarrage
            setTimeout(() => { playPauseBtn.focus(); showControls(); }, 500);
        });
    </script>
</body>
</html>
