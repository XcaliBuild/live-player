<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWise Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Style spécial Android TV & Mobile */
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
        body { margin: 0; background: #121212; color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        #menu { padding: 20px; text-align: center; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto;
        }

        /* Cartes des matchs */
        .card { 
            background: #1e1e1e; border-radius: 15px; padding: 15px; 
            transition: 0.3s; cursor: pointer; border: 3px solid transparent;
            display: flex; flex-direction: column; align-items: center;
        }
        .card:focus { transform: scale(1.08); border-color: #e50914; background: #252525; }
        .card img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; pointer-events: none; }
        .card p { margin: 5px 0 0; font-size: 14px; font-weight: bold; pointer-events: none; }

        /* Lecteur plein écran */
        #player-container { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100vw; height: 100vh; background: #000; z-index: 100; 
        }
        video { width: 100%; height: 100%; }
        
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 110;
            background: rgba(229, 9, 20, 0.8); color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>WebWise Stream</h1>
        <div id="match-grid" class="grid">
            <!-- Les matchs s'afficheront ici via script.js -->
        </div>
    </div>

    <div id="player-container">
        <button class="back-btn" onclick="closePlayer()">↩ RETOUR</button>
        <video id="video" controls playsinline></video>
    </div>

    <!-- On appelle le fichier Javascript séparé -->
    <script src="script.js"></script>
</body>
</html>
