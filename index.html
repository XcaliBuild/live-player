<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Writer. · Le Studio</title>
    <!-- Bibliothèques nécessaires pour créer/lire des PDF et EPUB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Courier+Prime&family=Lora&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f1115; --bg-panel: #1a1d24; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #3b82f6; --border-color: #2a2d35;
            --sheet-bg-clair: #ffffff; --sheet-text-clair: #111111;
            --sheet-bg-sombre: #121212; --sheet-text-sombre: #e0e0e0;
            --sheet-bg-papier: #f4ecd8; --sheet-text-papier: #433422;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR (Responsive) */
        .sidebar { width: 260px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: left 0.3s; z-index: 100; }
        .logo-area { padding: 20px; font-family: 'Newsreader', serif; font-size: 26px; font-weight: 700; font-style: italic; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;}
        .logo-area span { font-family: 'Inter', sans-serif; font-size: 11px; font-style: normal; color: var(--accent); display: block; text-transform: uppercase; letter-spacing: 2px;}
        .menu-list { flex: 1; padding: 15px 0; overflow-y: auto; }
        .menu-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-weight: 500; font-size: 14px; }
        .menu-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .menu-item.active { color: var(--accent); background: rgba(59, 130, 246, 0.1); border-right: 3px solid var(--accent); }
        .close-sidebar { display: none; background: none; border: none; color: white; font-size: 20px; cursor: pointer; }

        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; overflow: hidden; }
        
        /* TOPBAR & OUTILS */
        .topbar { padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: var(--bg-dark); gap: 10px; }
        .toolbar-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .mobile-menu-btn { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        select, .btn { background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; outline: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        /* Boutons de téléchargement personnalisés */
        .btn-pdf { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.2); }
        .btn-pdf:hover { background: #ef4444; color: white; }
        .btn-epub { background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.2); }
        .btn-epub:hover { background: #10b981; color: white; }
        
        .btn-icon { padding: 8px; border-radius: 50%; justify-content: center; width: 36px; height: 36px; }
        .btn-danger { color: #ef4444; }

        /* ZONE D'ÉDITION */
        .editor-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; justify-content: center; }
        .writing-sheet { width: 100%; max-width: 800px; background: var(--sheet-bg-sombre); color: var(--sheet-text-sombre); border-radius: 12px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 20px; transition: 0.3s; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; font-weight: 600; }
        input.text-input { background: transparent; border: none; border-bottom: 1px solid rgba(128,128,128,0.3); color: inherit; font-size: 22px; font-weight: 700; padding: 5px 0; outline: none; }
        textarea.main-textarea { width: 100%; flex: 1; min-height: 50vh; background: transparent; border: none; color: inherit; font-family: 'Newsreader', serif; font-size: 18px; line-height: 1.6; resize: none; outline: none; }

        /* UPLOAD CACHÉ */
        input[type="file"] { display: none; }

        /* RESPONSIVE MOBILE TACTILE */
        @media (max-width: 850px) {
            .sidebar { position: fixed; left: -260px; height: 100%; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .close-sidebar { display: block; }
            .mobile-menu-btn { display: block; }
            .topbar { padding: 10px; }
            .writing-sheet { padding: 20px; }
            .btn span { display: none; /* Cache le texte des boutons sur petit écran, garde l'icône */ }
            .btn-pdf span, .btn-epub span { display: inline; /* Garde le texte pour PDF et EPUB */ }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="logo-area">
            <div>Writer.<span>Le Studio</span></div>
            <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="menu-list">
            <div class="menu-item active" onclick="switchFormat('mybook')"><i class="fas fa-book"></i> Livre (Poche)</div>
            <div class="menu-item" onclick="switchFormat('magazine')"><i class="fas fa-th-large"></i> Magazine</div>
            <div class="menu-item" onclick="switchFormat('journal')"><i class="far fa-newspaper"></i> Journal</div>
            <div class="menu-item" onclick="switchFormat('bd')"><i class="fas fa-comment-dots"></i> Bande Dessinée</div>
            <div class="menu-item" onclick="switchFormat('enfant')"><i class="fas fa-child"></i> Livre pour enfants</div>
            <div class="menu-item" onclick="switchFormat('recette')"><i class="fas fa-utensils"></i> Recettes</div>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="toolbar-group">
                <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <select id="pageSelector" onchange="loadEditorData()"></select>
                <button class="btn" onclick="addNewElement()" title="Nouvelle Page"><i class="fas fa-plus"></i></button>
                <button class="btn btn-danger btn-icon" onclick="deleteElement()" title="Supprimer la page"><i class="fas fa-trash"></i></button>
            </div>
            
            <div class="toolbar-group">
                <!-- Selecteur de Font -->
                <select id="fontSelector" onchange="changeFont()">
                    <option value="'Newsreader', serif">Police: Classique</option>
                    <option value="'Inter', sans-serif">Police: Moderne</option>
                    <option value="'Courier Prime', monospace">Police: Machine à écrire</option>
                    <option value="'Lora', serif">Police: Poésie</option>
                </select>
                <!-- Ajouter une police -->
                <label class="btn" title="Importer une police (.ttf)"><i class="fas fa-font"></i><input type="file" accept=".ttf,.otf,.woff" onchange="loadCustomFont(event)"></label>
                
                <!-- Thème visuel -->
                <button class="btn btn-icon" onclick="cycleTheme()" title="Changer le thème d'écriture"><i class="fas fa-palette"></i></button>
                
                <!-- Importer EPUB -->
                <label class="btn" title="Ouvrir un EPUB existant pour le modifier"><i class="fas fa-folder-open"></i><span>Ouvrir EPUB</span><input type="file" accept=".epub" onchange="importEPUB(event)"></label>
                
                <!-- Exports -->
                <button class="btn btn-pdf" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> <span>PDF</span></button>
                <button class="btn btn-epub" onclick="exportEPUB()"><i class="fas fa-file-epub"></i> <span>EPUB</span></button>
            </div>
        </div>

        <div class="editor-container">
            <div class="writing-sheet" id="writingSheet">
                
                <div class="input-group" style="margin-bottom: 10px; border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 15px;">
                    <label id="globalTitleLabel">Titre de l'Oeuvre</label>
                    <input type="text" id="globalTitle" class="text-input" placeholder="Titre de votre projet..." oninput="autoSave()">
                </div>

                <div class="input-group">
                    <label id="titleLabel">Titre de la Page / Chapitre</label>
                    <input type="text" id="elementTitle" class="text-input" placeholder="Entrez le titre..." oninput="autoSave()">
                </div>
                
                <div class="input-group" style="flex: 1; margin-top: 10px;">
                    <label>Contenu du texte</label>
                    <textarea id="elementText" class="main-textarea" placeholder="Il était une fois..." oninput="autoSave()"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Div invisible utilisée pour la génération propre du PDF -->
    <div id="pdf-render-area" style="display: none; padding: 40px; color: black; background: white; width: 800px;"></div>

    <script>
        // --- ÉTATS ET DONNÉES ---
        let bookPages = [{ id: '0', title: 'Chapitre 1', text: '' }];
        let currentId = '0';
        let themes = ['sombre', 'clair', 'papier'];
        let currentThemeIndex = 0;

        // --- GESTION DE L'INTERFACE TACTILE ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function switchFormat(format) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            toggleSidebar(); // Ferme le menu sur mobile après un clic
        }

        // --- GESTION DES PAGES ---
        function refreshSelector() {
            const selector = document.getElementById('pageSelector');
            selector.innerHTML = '';
            bookPages.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = item.id;
                opt.text = item.title ? item.title : `Page ${index + 1}`;
                selector.appendChild(opt);
            });
            if(!bookPages.find(p => p.id === currentId) && bookPages.length > 0) currentId = bookPages[0].id;
            selector.value = currentId;
        }

        function loadEditorData() {
            currentId = document.getElementById('pageSelector').value;
            const item = bookPages.find(i => i.id === currentId);
            if(item) {
                document.getElementById('elementTitle').value = item.title || '';
                document.getElementById('elementText').value = item.text || '';
            }
        }

        function autoSave() {
            if(!currentId) return;
            let item = bookPages.find(i => i.id === currentId);
            if(item) {
                item.title = document.getElementById('elementTitle').value;
                item.text = document.getElementById('elementText').value;
                document.getElementById('pageSelector').querySelector(`option[value="${currentId}"]`).text = item.title || `Page`;
            }
        }

        function addNewElement() {
            let maxId = -1;
            bookPages.forEach(i => maxId = Math.max(maxId, parseInt(i.id)));
            const newId = (maxId + 1).toString();
            bookPages.push({ id: newId, title: '', text: '' });
            refreshSelector();
            document.getElementById('pageSelector').value = newId;
            loadEditorData();
        }

        function deleteElement() {
            if(bookPages.length <= 1) return alert("Vous ne pouvez pas supprimer la dernière page.");
            if(confirm("Supprimer cette page ?")) {
                bookPages = bookPages.filter(i => i.id !== currentId);
                refreshSelector();
                loadEditorData();
            }
        }

        // --- GESTION DU THÈME ET POLICES ---
        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            const sheet = document.getElementById('writingSheet');
            if(theme === 'clair') { sheet.style.background = 'var(--sheet-bg-clair)'; sheet.style.color = 'var(--sheet-text-clair)'; }
            else if (theme === 'papier') { sheet.style.background = 'var(--sheet-bg-papier)'; sheet.style.color = 'var(--sheet-text-papier)'; }
            else { sheet.style.background = 'var(--sheet-bg-sombre)'; sheet.style.color = 'var(--sheet-text-sombre)'; }
        }

        function changeFont() {
            const font = document.getElementById('fontSelector').value;
            document.getElementById('elementText').style.fontFamily = font;
            document.getElementById('elementTitle').style.fontFamily = font;
        }

        function loadCustomFont(event) {
            const file = event.target.files[0];
            if(!file) return;
            const fontUrl = URL.createObjectURL(file);
            const newStyle = document.createElement('style');
            newStyle.appendChild(document.createTextNode(`
                @font-face { font-family: 'CustomUserFont'; src: url('${fontUrl}'); }
                .custom-font-active { font-family: 'CustomUserFont', sans-serif !important; }
            `));
            document.head.appendChild(newStyle);
            document.getElementById('elementText').classList.add('custom-font-active');
            document.getElementById('elementTitle').classList.add('custom-font-active');
            alert("Votre police a été appliquée avec succès !");
        }

        // ===============================================
        // 📚 MOTEUR D'IMPORTATION EPUB
        // ===============================================
        async function importEPUB(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            alert("Lecture de l'EPUB en cours... Cela peut prendre quelques secondes.");
            try {
                const zip = await JSZip.loadAsync(file);
                bookPages = []; // On réinitialise le livre
                let pageIndex = 0;

                // Parcours simple pour trouver les fichiers HTML/XHTML dans l'EPUB
                for (let filename of Object.keys(zip.files)) {
                    if(filename.endsWith('.html') || filename.endsWith('.xhtml')) {
                        const content = await zip.file(filename).async("string");
                        
                        // Nettoyage basique du HTML pour récupérer le texte
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(content, "text/html");
                        
                        // Essayer de trouver un titre (h1, h2, ou la balise title)
                        let title = doc.querySelector('h1, h2, title');
                        let pageTitle = title ? title.innerText.trim() : `Chapitre ${pageIndex + 1}`;
                        
                        // Récupérer tout le texte des paragraphes
                        let paragraphs = Array.from(doc.querySelectorAll('p')).map(p => p.innerText.trim()).filter(p => p.length > 0);
                        let text = paragraphs.join('\n\n');
                        
                        if(text.length > 0) {
                            bookPages.push({ id: pageIndex.toString(), title: pageTitle, text: text });
                            pageIndex++;
                        }
                    }
                }
                
                if(bookPages.length === 0) {
                    bookPages = [{ id: '0', title: 'Erreur', text: "Impossible de lire le texte de cet EPUB." }];
                }
                
                document.getElementById('globalTitle').value = file.name.replace('.epub', '');
                refreshSelector();
                loadEditorData();
                alert("EPUB importé avec succès ! Vous pouvez maintenant le corriger.");
                
            } catch (e) {
                alert("Erreur lors de l'ouverture de l'EPUB. Le fichier est peut-être corrompu ou protégé.");
            }
        }

        // ===============================================
        // 📄 MOTEUR D'EXPORTATION PDF
        // ===============================================
        function exportPDF() {
            autoSave();
            const title = document.getElementById('globalTitle').value || "Livre";
            const renderArea = document.getElementById('pdf-render-area');
            
            // On construit le HTML du livre pour le PDF
            let htmlContent = `<div style="text-align: center; margin-bottom: 200px; margin-top: 100px;"><h1>${title}</h1></div>`;
            bookPages.forEach(page => {
                htmlContent += `<div style="page-break-before: always; margin-bottom: 20px;"><h2>${page.title}</h2><p style="text-align: justify; line-height: 1.6; font-size: 14px;">${page.text.replace(/\n/g, '<br><br>')}</p></div>`;
            });
            
            renderArea.innerHTML = htmlContent;
            renderArea.style.display = 'block';

            // Options du PDF
            const opt = {
                margin:       20,
                filename:     `${title}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Création et téléchargement
            html2pdf().set(opt).from(renderArea).save().then(() => {
                renderArea.style.display = 'none'; // On recache la zone
            });
        }

        // ===============================================
        // 📗 MOTEUR D'EXPORTATION EPUB (Générateur)
        // ===============================================
        async function exportEPUB() {
            autoSave();
            const title = document.getElementById('globalTitle').value || "Livre";
            const zip = new JSZip();
            
            // 1. Déclaration MIME (Obligatoire pour EPUB)
            zip.file("mimetype", "application/epub+zip");
            
            // 2. Dossier META-INF
            const metaInf = zip.folder("META-INF");
            metaInf.file("container.xml", `<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`);
            
            // 3. Dossier OEBPS (Le contenu)
            const oebps = zip.folder("OEBPS");
            let manifest = ''; 
            let spine = '';
            
            bookPages.forEach((page, i) => {
                let html = `<?xml version="1.0" encoding="UTF-8"?><html xmlns="http://www.w3.org/1999/xhtml"><head><title>${page.title}</title></head><body><h2>${page.title}</h2><p>${page.text.replace(/\n/g, '<br/>')}</p></body></html>`;
                oebps.file(`page${i}.xhtml`, html);
                manifest += `<item id="page${i}" href="page${i}.xhtml" media-type="application/xhtml+xml"/>\n`;
                spine += `<itemref idref="page${i}"/>\n`;
            });
            
            // Fichier de configuration du livre (content.opf)
            let opf = `<?xml version="1.0" encoding="UTF-8"?>
            <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="pub-id">
                <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
                    <dc:title>${title}</dc:title>
                    <dc:language>fr</dc:language>
                </metadata>
                <manifest>
                    ${manifest}
                </manifest>
                <spine>
                    ${spine}
                </spine>
            </package>`;
            oebps.file("content.opf", opf);
            
            // Compilation et téléchargement
            const content = await zip.generateAsync({type:"blob"});
            const url = URL.createObjectURL(content);
            const a = document.createElement("a"); 
            a.href = url; 
            a.download = `${title}.epub`;
            a.click(); 
            URL.revokeObjectURL(url);
        }

        // Démarrage initial
        refreshSelector();
        loadEditorData();
    </script>
</body>
</html>
