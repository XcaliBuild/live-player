<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pages. · Livre de Poche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root[data-theme="creme"] {
      --bg-page: #faf8f5;
      --text-primary: #1a1a1a;
      --text-secondary: #333333;
      --text-tertiary: #8a8a8a;
      --border-subtle: #eae5df;
      --accent-soft: rgba(0, 0, 0, 0.05);
      --overlay-bg: rgba(250, 248, 245, 0.85);
    }
    :root[data-theme="nuit"] {
      --bg-page: #121212;
      --text-primary: #f0f0f0;
      --text-secondary: #c4c4c4;
      --text-tertiary: #6b6b6b;
      --border-subtle: #2a2a2a;
      --accent-soft: rgba(255, 255, 255, 0.1);
      --overlay-bg: rgba(18, 18, 18, 0.85);
    }
    :root[data-theme="papier"] {
      --bg-page: #fdf6e3;
      --text-primary: #3e3a32;
      --text-secondary: #5a5446;
      --text-tertiary: #8e8679;
      --border-subtle: #e0d5bb;
      --accent-soft: rgba(0, 0, 0, 0.06);
      --overlay-bg: rgba(253, 246, 227, 0.85);
    }
    :root[data-theme="lavande"] {
      --bg-page: #f7f5fb;
      --text-primary: #2b2540;
      --text-secondary: #4a4266;
      --text-tertiary: #8b83a8;
      --border-subtle: #e3dfed;
      --accent-soft: rgba(43, 37, 64, 0.08);
      --overlay-bg: rgba(247, 245, 251, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-page);
      font-family: 'Newsreader', Georgia, serif;
      touch-action: pan-y;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    .app-frame {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Header en Overlay (Flottant au-dessus du texte) */
    .overlay-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      background: var(--overlay-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo-text {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      font-style: italic;
    }
    .header-tools {
      display: flex;
      gap: 12px;
    }
    .tool-btn {
      background: var(--accent-soft);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 1.1rem;
      width: 42px;
      height: 42px;
      border-radius: 50%; /* Boutons ronds modernes */
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
    }
    .tool-btn:active {
      transform: scale(0.92);
      background: var(--border-subtle);
    }

    /* Scène du lecteur */
    .reader-stage {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .page-card {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, opacity 0.3s ease;
      overflow-y: auto;
      background: var(--bg-page);
      scrollbar-width: none;
    }
    .page-card::-webkit-scrollbar { display: none; }

    /* Animations de navigation */
    .page-active { transform: translateX(0); opacity: 1; z-index: 5; }
    .page-before { transform: translateX(-100%); opacity: 0; z-index: 2; pointer-events: none; }
    .page-after { transform: translateX(100%); opacity: 0; z-index: 2; pointer-events: none; }
    .page-slide-out-left { transform: translateX(-100%); opacity: 0; z-index: 10; }
    .page-slide-out-right { transform: translateX(100%); opacity: 0; z-index: 10; }

    /* Contenu du texte (Marges pour ne pas être caché par le header) */
    .page-content {
      padding: 90px 24px 60px 24px; /* 90px top pour éviter l'overlay */
      max-width: 800px;
      margin: 0 auto;
    }
    .page-category {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-tertiary);
      margin-bottom: 12px;
      font-weight: 500;
    }
    .page-title {
      font-size: 1.8rem;
      line-height: 1.2;
      color: var(--text-primary);
      margin-bottom: 24px;
      font-weight: 600;
    }
    .page-text {
      font-size: 1.05rem; /* Taille idéale pour lecture prolongée */
      line-height: 1.7;
      color: var(--text-secondary);
      text-align: justify;
      hyphens: auto;
    }
    .page-text p {
      margin-bottom: 18px;
      text-indent: 20px; /* Alinéa classique de livre */
    }
    .page-text p:first-of-type {
      text-indent: 0;
    }

    /* Pied de page discret (numéro de page) */
    .reader-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      color: var(--text-tertiary);
      background: var(--overlay-bg);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    /* Panneau de recherche (Modal) */
    .search-panel {
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .search-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .search-input-wrapper {
      flex: 1;
      position: relative;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border-radius: 30px;
      border: 1px solid var(--border-subtle);
      background: var(--accent-soft);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
    }
    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-item {
      padding: 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      cursor: pointer;
    }
    .result-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .result-snippet {
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .toast-message {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-page);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
      pointer-events: none;
    }
    .toast-message.show { opacity: 1; }
    
    .splash {
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: var(--text-primary);
      font-size: 2rem;
      font-style: italic;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="app-frame" id="appFrame">
  <div class="splash" id="splashScreen">Pages.</div>
  
  <header class="overlay-header">
    <span class="logo-text">Pages.</span>
    <div class="header-tools">
      <button class="tool-btn" id="btnSearch" aria-label="Rechercher"><i class="fas fa-search"></i></button>
      <button class="tool-btn" id="btnTheme" aria-label="Thème"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <div class="reader-stage" id="readerStage">
    <div class="page-card page-active" id="pageCardA"></div>
    <div class="page-card" id="pageCardB" style="display:none;"></div>
  </div>

  <div class="reader-footer">
    <span id="pageCounter">1 / 1</span>
  </div>

  <div class="search-panel" id="searchPanel">
    <div class="search-header">
      <div class="search-input-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un mot..." autocomplete="off">
      </div>
      <button class="tool-btn" id="closeSearchPanel" style="background:transparent; border:none;"><i class="fas fa-times"></i></button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="toast-message" id="toast"></div>
</div>

<script>
  (function() {
    let BOOK_PAGES = [];
    const DATA_URL = 'livre.txt';

    const STORAGE_KEY_PAGE = "pgs_current_page";
    let currentPageIndex = 0;
    let activeCard = 'A';
    let isAnimating = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeHandled = false;

    const themes = ['nuit', 'creme', 'papier', 'lavande'];
    const themeIcons = ['fa-moon', 'fa-sun', 'fa-leaf', 'fa-feather'];
    let themeIndex = 0;

    const pageCardA = document.getElementById('pageCardA');
    const pageCardB = document.getElementById('pageCardB');
    const pageCounter = document.getElementById('pageCounter');
    const toast = document.getElementById('toast');
    
    // UI Recherche
    const searchPanel = document.getElementById('searchPanel');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const btnSearch = document.getElementById('btnSearch');
    const closeSearchPanel = document.getElementById('closeSearchPanel');
    
    const splashScreen = document.getElementById('splashScreen');
    const btnTheme = document.getElementById('btnTheme');
    const readerStage = document.getElementById('readerStage');

    function safeGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
    function safeSet(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }

    function renderPageInto(cardElement, pageData) {
      if (!pageData) return;
      cardElement.innerHTML = `
        <div class="page-content">
          <div class="page-category">${pageData.category || ''}</div>
          <div class="page-title">${pageData.title || ''}</div>
          <div class="page-text">${pageData.text || ''}</div>
        </div>
      `;
    }

    function getActiveCardElement() { return activeCard === 'A' ? pageCardA : pageCardB; }
    function getInactiveCardElement() { return activeCard === 'A' ? pageCardB : pageCardA; }

    function updatePageDisplay() {
      pageCounter.textContent = `${currentPageIndex + 1} / ${BOOK_PAGES.length}`;
      safeSet(STORAGE_KEY_PAGE, currentPageIndex);
    }

    function initialRender() {
      if (!BOOK_PAGES.length) return;
      renderPageInto(pageCardA, BOOK_PAGES[currentPageIndex]);
      pageCardA.className = 'page-card page-active';
      pageCardB.style.display = 'none';
      pageCardB.className = 'page-card';
      activeCard = 'A';
      updatePageDisplay();
    }

    function animateTransition(direction) {
      if (isAnimating || !BOOK_PAGES.length) return;
      if (direction === 'next' && currentPageIndex >= BOOK_PAGES.length - 1) {
        showToastMessage('Fin du livre'); return;
      }
      if (direction === 'prev' && currentPageIndex <= 0) {
        showToastMessage('Début du livre'); return;
      }
      isAnimating = true;
      const oldCard = getActiveCardElement();
      const newCard = getInactiveCardElement();
      const newIndex = direction === 'next' ? currentPageIndex + 1 : currentPageIndex - 1;
      
      renderPageInto(newCard, BOOK_PAGES[newIndex]);
      newCard.scrollTop = 0;

      oldCard.classList.remove('page-active');
      newCard.style.display = 'flex';
      newCard.classList.remove('page-before', 'page-after', 'page-slide-out-left', 'page-slide-out-right');

      if (direction === 'next') {
        oldCard.classList.add('page-slide-out-left');
        newCard.classList.add('page-after');
        void newCard.offsetWidth;
        newCard.classList.remove('page-after');
        newCard.classList.add('page-active');
      } else {
        oldCard.classList.add('page-slide-out-right');
        newCard.classList.add('page-before');
        void newCard.offsetWidth;
        newCard.classList.remove('page-before');
        newCard.classList.add('page-active');
      }

      setTimeout(() => {
        oldCard.style.display = 'none';
        oldCard.classList.remove('page-slide-out-left', 'page-slide-out-right');
        activeCard = activeCard === 'A' ? 'B' : 'A';
        currentPageIndex = newIndex;
        updatePageDisplay();
        isAnimating = false;
      }, 300);
    }

    function navigateToPage(index) {
      if (index === currentPageIndex || isAnimating || !BOOK_PAGES.length) return;
      const direction = index > currentPageIndex ? 'next' : 'prev';
      currentPageIndex = direction === 'next' ? index - 1 : index + 1;
      animateTransition(direction);
    }

    // Gestion de la recherche
    function handleSearch() {
      const query = searchInput.value.toLowerCase().trim();
      searchResults.innerHTML = '';
      if (!query) {
        searchResults.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); margin-top:20px;">Tapez un mot pour chercher.</div>';
        return;
      }
      
      const results = BOOK_PAGES.map((page, index) => {
        // Enlever les balises HTML pour la recherche
        const plainText = page.text.replace(/<[^>]+>/g, '').toLowerCase();
        if (plainText.includes(query) || (page.title && page.title.toLowerCase().includes(query))) {
          // Extraire un extrait
          const matchIndex = plainText.indexOf(query);
          const start = Math.max(0, matchIndex - 40);
          const end = Math.min(plainText.length, matchIndex + 40);
          let snippet = plainText.substring(start, end);
          if (start > 0) snippet = '...' + snippet;
          if (end < plainText.length) snippet = snippet + '...';
          
          return { index, title: page.title, snippet };
        }
        return null;
      }).filter(Boolean);

      if (results.length === 0) {
        searchResults.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); margin-top:20px;">Aucun résultat trouvé.</div>';
      } else {
        results.forEach(res => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <div class="result-title">Page ${res.index + 1} - ${res.title}</div>
            <div class="result-snippet">${res.snippet}</div>
          `;
          div.addEventListener('click', () => {
            searchPanel.style.display = 'none';
            navigateToPage(res.index);
          });
          searchResults.appendChild(div);
        });
      }
    }

    btnSearch.addEventListener('click', () => {
      searchPanel.style.display = 'flex';
      searchInput.value = '';
      searchResults.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); margin-top:20px;">Tapez un mot pour chercher.</div>';
      setTimeout(() => searchInput.focus(), 100);
    });

    closeSearchPanel.addEventListener('click', () => { searchPanel.style.display = 'none'; });
    searchInput.addEventListener('input', handleSearch);

    // Gestes tactiles pour tourner la page
    function handleTouchStart(e) {
      if (isAnimating) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swipeHandled = false;
    }
    function handleTouchMove(e) {
      if (isAnimating || swipeHandled) return;
      const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
      const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
      if (deltaY > deltaX) return; 
    }
    function handleTouchEnd(e) {
      if (isAnimating || swipeHandled) return;
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
      if (deltaY < 30) {
        const threshold = 50;
        if (deltaX < -threshold) { swipeHandled = true; animateTransition('next'); }
        else if (deltaX > threshold) { swipeHandled = true; animateTransition('prev'); }
      }
    }

    function cycleTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      const theme = themes[themeIndex];
      document.documentElement.setAttribute('data-theme', theme);
      btnTheme.querySelector('i').className = `fas ${themeIcons[themeIndex]}`;
      const themeNames = ['Nuit', 'Crème', 'Papier', 'Lavande'];
      showToastMessage(`${themeNames[themeIndex]}`);
    }

    function showToastMessage(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function restoreSession() {
      const saved = safeGet(STORAGE_KEY_PAGE);
      if (saved !== null) {
        const parsed = parseInt(saved, 10);
        if (!isNaN(parsed) && parsed >= 0 && parsed < BOOK_PAGES.length) {
          currentPageIndex = parsed;
        }
      }
      initialRender();
      setTimeout(() => splashScreen.style.display = 'none', 300);
    }

    async function loadBookData() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error('Fichier introuvable');
        const data = await response.json();
        if (data.pages && Array.isArray(data.pages)) {
          BOOK_PAGES = data.pages;
        } else if (Array.isArray(data)) {
          BOOK_PAGES = data;
        } else {
          throw new Error('Format JSON invalide');
        }
        restoreSession();
      } catch (err) {
        splashScreen.innerHTML = '<div style="font-size:1.2rem; text-align:center; padding:30px; font-family:\'Inter\', sans-serif;">Impossible de charger le livre.<br><span style="font-size:0.9rem; color:gray; margin-top:10px; display:block;">Vérifiez le fichier livre.txt</span></div>';
      }
    }

    readerStage.addEventListener('touchstart', handleTouchStart, {passive: true});
    readerStage.addEventListener('touchmove', handleTouchMove, {passive: true});
    readerStage.addEventListener('touchend', handleTouchEnd);
    btnTheme.addEventListener('click', cycleTheme);

    loadBookData();
  })();
</script>
</body>
</html>
