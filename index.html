<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Play TV</title>
    <!-- Utilisation de la version stable 1.x de hls.js (équivalent v10+) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg-color: #000000;
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --black-70: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* --- UI AUTO-HIDE GLOBAL --- */
        .ui-element {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 10;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* --- GAUCHE : LISTE DES CHAINES --- */
        #channels-container {
            position: absolute;
            top: 0; left: 0;
            width: 300px; height: 100%;
            background: var(--black-70); /* Bande Vertical Noire, Transparent à 70% */
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 20px 10px;
            box-sizing: border-box;
            overflow-y: auto;
            transform: translateX(0);
        }

        #channels-container.ui-hidden {
            transform: translateX(-100%);
        }

        #channels-container::-webkit-scrollbar { display: none; }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .channel-card img {
            width: 40px; height: 30px;
            object-fit: contain;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .channel-name {
            font-size: 12px; /* Petite police */
            font-weight: bold;
        }

        /* Effet ZOOM et VITRÉ sur le focus */
        .channel-card.focused {
            transform: scale(1.1); /* ZOOM */
            background: var(--glass-bg);
            backdrop-filter: blur(5px); /* Effet Vitré */
            border-color: var(--accent-neon);
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Indicateur central CH.XX */
        #center-channel-indicator {
            position: absolute;
            left: 320px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* --- HAUT DROITE : HEURE ET CHAINE --- */
        #top-right-info {
            position: absolute;
            top: 20px; right: 30px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-neon);
        }
        #clock { font-size: 24px; font-weight: bold; }
        #top-channel { font-size: 14px; color: var(--text-secondary); }

        /* --- DROITE : INTERFACE VOLUME UNIQUE (AUTO-HIDE APPART) --- */
        #volume-container {
            position: absolute;
            right: 40px; top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 240px;
            background: rgba(0,0,0,0.85);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 5px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.3s ease;
            opacity: 0; /* Caché par défaut */
            pointer-events: none;
        }
        #volume-container.volume-active {
            opacity: 1; /* Apparaît uniquement lors du changement */
        }
        #volume-text {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-neon);
        }
        .volume-track {
            width: 8px;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #volume-fill {
            width: 100%;
            height: 50%;
            background: var(--accent-neon);
            border-radius: 4px;
            transition: height 0.1s ease;
        }

        /* --- BAS : INFO BAR --- */
        #bottom-info {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: transparent; /* Arrière plan transparent */
            text-align: left;
        }
        #bottom-title {
            font-size: 20px; font-weight: bold; margin-bottom: 5px;
            text-shadow: 1px 1px 3px #000;
        }
        #bottom-epg {
            font-size: 14px; color: var(--text-secondary); margin-bottom: 10px;
            text-shadow: 1px 1px 3px #000;
        }
        .progress-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        .progress-bar-fill {
            width: 35%; /* Barre de progression si EPG */
            height: 100%;
            background: var(--accent-neon);
            border-radius: 3px;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 3;
            display: block;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="loader"></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <!-- UI Elements Globaux -->
    <div id="channels-container" class="ui-element"></div>
    <div id="center-channel-indicator" class="ui-element">CH.1</div>

    <div id="top-right-info" class="ui-element">
        <div id="clock">00:00</div>
        <div id="top-channel">CHAINE 1</div>
    </div>

    <div id="bottom-info" class="ui-element">
        <div id="bottom-title">Nom de la Chaîne</div>
        <div id="bottom-epg">Programme EPG Actuel...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Elément Volume indépendant -->
    <div id="volume-container">
        <div id="volume-text">50%</div>
        <div class="volume-track">
            <div id="volume-fill"></div>
        </div>
    </div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/XcaliBuild/live-player/refs/heads/main/FreeSportTV.m3u";[cite: 3]
        
        let channels = [];
        let currentIndex = 0;
        let hideTimeout;
        let volumeTimeout;
        let hls = null;
        
        const video = document.getElementById('video');
        const container = document.getElementById('channels-container');
        const loader = document.getElementById('loader');
        const uiElements = document.querySelectorAll('.ui-element');
        const volumeContainer = document.getElementById('volume-container');

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            await loadM3U();[cite: 3]
            resetHideTimeout();
            
            video.addEventListener('waiting', () => loader.style.display = 'block');
            video.addEventListener('playing', () => loader.style.display = 'none');
            video.addEventListener('loadstart', () => loader.style.display = 'block');
            
            // Volume initial par défaut
            video.volume = 0.5;
            updateVolumeUI();
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }

        // Gestion de l'affichage global (Sauf Volume)
        function resetHideTimeout() {
            showUI();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideUI(); }, 4000);
        }

        function showUI() { uiElements.forEach(el => el.classList.remove('ui-hidden')); }
        function hideUI() { uiElements.forEach(el => el.classList.add('ui-hidden')); }

        // Gestion exclusive de la visibilité du Volume
        function triggerVolumeUI() {
            volumeContainer.classList.add('volume-active');
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => {
                volumeContainer.classList.remove('volume-active');
            }, 2000); // Reste affiché pendant 2 secondes
        }

        window.addEventListener('click', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);
        window.addEventListener('mousemove', resetHideTimeout);

        async function loadM3U() {[cite: 3]
            try {
                const res = await fetch(m3uUrl);[cite: 3]
                const text = await res.text();[cite: 3]
                const lines = text.split('\n');[cite: 3]
                let currentChannel = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {[cite: 3]
                        const name = line.split(',')[1] || "";[cite: 3]
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);[cite: 3]
                        const groupMatch = line.match(/group-title="([^"]+)"/);[cite: 3]

                        currentChannel = {
                            name: name.trim(),[cite: 3]
                            logo: logoMatch ? logoMatch[1] : "",[cite: 3]
                            group: groupMatch ? groupMatch[1] : "",[cite: 3]
                            url: ""
                        };
                    } else if (line.startsWith('http') && currentChannel) {[cite: 3]
                        currentChannel.url = line;[cite: 3]
                        channels.push(currentChannel);[cite: 3]
                        currentChannel = null;[cite: 3]
                    }
                });

                if (channels.length > 0) {[cite: 3]
                    buildUI();[cite: 3]
                    setFocus(0);[cite: 3]
                    playChannel(0);[cite: 3]
                }
            } catch (err) {
                console.error("Erreur M3U:", err);
            }
        }

        function buildUI() {[cite: 3]
            container.innerHTML = '';[cite: 3]
            channels.forEach((channel, index) => {[cite: 3]
                const card = document.createElement('div');[cite: 3]
                card.className = `channel-card`;[cite: 3]
                card.id = `channel-${index}`;[cite: 3]
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:40px;height:30px;background:rgba(255,255,255,0.08);border-radius:4px;"></div>`;[cite: 3]

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${channel.name}</div>
                    </div>
                `;[cite: 3]

                card.addEventListener('click', (e) => {[cite: 3]
                    e.stopPropagation();[cite: 3]
                    setFocus(index);[cite: 3]
                    playChannel(index);[cite: 3]
                    resetHideTimeout();[cite: 3]
                });

                container.appendChild(card);[cite: 3]
            });
        }

        function setFocus(index) {[cite: 3]
            const cards = document.querySelectorAll('.channel-card');[cite: 3]
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');[cite: 3]
            
            currentIndex = index;[cite: 3]
            const activeCard = cards[currentIndex];[cite: 3]
            if(activeCard) {[cite: 3]
                activeCard.classList.add('focused');[cite: 3]
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });[cite: 3]
            }

            const channel = channels[index];[cite: 3]
            const chNum = index + 1;
            document.getElementById('center-channel-indicator').innerText = `CH.${chNum}`;
            document.getElementById('top-channel').innerText = `CHAINE ${chNum}`;
            document.getElementById('bottom-title').innerText = channel.name;[cite: 3]
            document.getElementById('bottom-epg').innerText = channel.group || "Aucune information EPG";[cite: 3]
        }

        function playChannel(index) {[cite: 3]
            const channel = channels[index];[cite: 3]
            if (!channel) return;[cite: 3]

            loader.style.display = 'block';[cite: 3]

            if (hls) { hls.destroy(); }[cite: 3]

            // Configuration renforcée pour forcer la lecture et limiter les blocages CORS/sécurité
            if (Hls.isSupported()) {[cite: 3]
                hls = new Hls({
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    lowLatencyMode: true,
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false; // Évite certains rejets de serveurs de flux
                    }
                });
                hls.loadSource(channel.url);[cite: 3]
                hls.attachMedia(video);[cite: 3]
                hls.on(Hls.Events.MANIFEST_PARSED, () => {[cite: 3]
                    video.play().catch(e => console.log("Lancement automatique bloqué, nécessite action utilisateur.")); 
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Erreur réseau - Tentative de récupération...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Erreur Média - Tentative de récupération...");
                                hls.recoverMediaError();
                                break;
                            default:
                                loader.style.display = 'none';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {[cite: 3]
                video.src = channel.url;[cite: 3]
                video.addEventListener('loadedmetadata', () => { video.play(); });[cite: 3]
            }
        }

        function updateVolumeUI() {
            const fill = document.getElementById('volume-fill');
            const txt = document.getElementById('volume-text');
            const pct = Math.round(video.volume * 100);
            fill.style.height = `${pct}%`;
            txt.innerText = `${pct}%`;
        }

        // --- NAVIGATION TÉLÉCOMMANDE / CLAVIER ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {[cite: 3]
                resetHideTimeout();
                if (currentIndex > 0) { setFocus(currentIndex - 1); }[cite: 3]
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {[cite: 3]
                resetHideTimeout();
                if (currentIndex < channels.length - 1) { setFocus(currentIndex + 1); }[cite: 3]
                e.preventDefault();
            } else if (e.key === 'Enter') {[cite: 3]
                resetHideTimeout();
                playChannel(currentIndex);[cite: 3]
                e.preventDefault();
            } 
            // Gestion Volume : Declenche l'UI spécifique du volume uniquement
            else if (e.key === '+' || e.key === 'ArrowRight') {
                triggerVolumeUI();
                video.volume = Math.min(video.volume + 0.05, 1);
                updateVolumeUI();
                e.preventDefault();
            } else if (e.key === '-' || e.key === 'ArrowLeft') {
                triggerVolumeUI();
                video.volume = Math.max(video.volume - 0.05, 0);
                updateVolumeUI();
                e.preventDefault();
            }
        });

        init();
    </script>
</body>
</html>
