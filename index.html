<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Play TV - Premium Crystal Loop</title>
    
    <link href="https://unpkg.com/video.js/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js/dist/video.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --black-15: rgba(0, 0, 0, 0.15);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
        }

        /* Forcer Video.js à prendre tout l'écran */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            background-color: #000000;
        }

        /* --- INTERFACE AUTO-HIDE GLOBALE --- */
        .ui-element {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 10;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* --- ZONE DE NAVIGATION GAUCHE --- */
        #sidebar-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 350px; height: 100%;
            background: var(--black-15);
            z-index: 10;
            overflow: hidden;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        #sidebar-wrapper.ui-hidden {
            transform: translateX(-100%);
        }

        /* CURSEUR FIXE AU CENTRE STATIC */
        #fixed-cursor {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 330px;
            height: 70px;
            border: 2px solid var(--accent-neon);
            background: var(--glass-bg);
            border-radius: 14px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.45), 
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* CONTENEUR DE LA LISTE */
        #channels-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        #channels-container::-webkit-scrollbar { display: none; }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 54px;
            height: 54px;
            padding: 5px 10px;
            box-sizing: border-box;
            border-radius: 8px;
            background: transparent !important; 
            border: none !important; 
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease, color 0.25s ease;
            opacity: 0.4; 
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 6;
        }

        .channel-card img {
            width: 30px; height: 20px;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .channel-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-card.focused {
            transform: scale(1.25);
            transform-origin: left center;
            opacity: 1;
            color: #ffffff;
            font-weight: bold;
        }
        .channel-card.focused img {
            width: 44px; height: 30px;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .channel-card.active-playing .channel-name {
            color: var(--accent-neon);
        }

        /* Indicateur central CH.XX */
        #center-channel-indicator {
            position: absolute;
            left: 370px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* --- RECTANGLE HORLOGE --- */
        #top-right-info {
            position: absolute;
            top: 25px; right: 35px;
            text-align: right;
            background: rgba(0,0,0,0.75);
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15);
            border-right: 3px solid var(--accent-neon);
        }
        #clock { font-size: 20px; font-weight: bold; }
        #top-channel { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

        /* --- SOUBASSEMENT BARRE DE PROGRESSION UNIQUEMENT --- */
        #bottom-info {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 75%;
            background: transparent;
        }
        
        #progress-wrapper {
            width: 100%;
            height: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #progress-wrapper.show-progress {
            opacity: 1;
        }
        .progress-bar-bg {
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }
        .progress-bar-fill {
            width: 40%; height: 100%;
            background: var(--accent-neon);
            border-radius: 3px;
        }

        /* --- HUD SÉPARÉ POUR LE VOLUME --- */
        #volume-hud {
            position: absolute;
            top: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid var(--accent-neon);
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        /* LOADER AU CENTRE */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 30;
            display: none; /* Géré par Video.js maintenant */
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="loader"></div>
        <video id="vidVideojs" class="video-js vjs-default-skin" autoplay playsinline></video>
    </div>

    <div id="sidebar-wrapper" class="ui-element">
        <div id="fixed-cursor"></div>
        <div id="channels-container"></div>
    </div>
    
    <div id="center-channel-indicator" class="ui-element">CH.1</div>

    <div id="top-right-info" class="ui-element">
        <div id="clock">00:00</div>
        <div id="top-channel">CHAINE 1</div>
    </div>

    <div id="volume-hud">🔊 Volume: 50%</div>

    <div id="bottom-info">
        <div id="progress-wrapper">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const m3uUrl = "https://gist.githubusercontent.com/XcaliBuild/06a1373a62a174289f3ea0805e9c4da7/raw/bad59ce7fcf3e5170141f2498573f12f28ec034f/gistfile1.txt";
        
        let channels = [];
        let originalLength = 0;
        let currentIndex = 0;
        let hideTimeout;
        let progressTimeout;
        let volumeTimeout;
        let autoplayTimeout;
        
        const container = document.getElementById('channels-container');
        const wrapper = document.getElementById('sidebar-wrapper');
        const loader = document.getElementById('loader');
        const uiElements = document.querySelectorAll('.ui-element');
        const progressWrapper = document.getElementById('progress-wrapper');
        const volumeHud = document.getElementById('volume-hud');

        let vjsPlayer = null;

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            
            // Initialisation de Video.js
            vjsPlayer = videojs('vidVideojs', {
                controls: false, // On désactive les contrôles de base pour garder ton design
                autoplay: true,
                muted: true, // Requis pour l'autoplay sur la plupart des navigateurs
                preload: 'auto',
                html5: {
                    vhs: {
                        overrideNative: true, // Force le moteur VHS de Video.js (excellent pour l'IPTV)
                    }
                }
            });

            // Gestion du Loader avec les événements Video.js
            vjsPlayer.on('waiting', () => loader.style.display = 'block');
            vjsPlayer.on('playing', () => loader.style.display = 'none');
            vjsPlayer.on('canplay', () => loader.style.display = 'none');
            vjsPlayer.on('error', () => {
                loader.style.display = 'none';
                console.error("Erreur Video.js : Le flux n'a pas pu être chargé.");
            });

            await loadM3U();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        }

        function resetHideTimeout() {
            showUI();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideUI(); }, 4000);
        }

        function showUI() { 
            wrapper.classList.remove('ui-hidden'); 
            uiElements.forEach(el => el.classList.remove('ui-hidden')); 
        }
        
        function hideUI() { 
            wrapper.classList.add('ui-hidden'); 
            uiElements.forEach(el => el.classList.add('ui-hidden')); 
        }

        function flashProgressBar() {
            progressWrapper.classList.add('show-progress');
            clearTimeout(progressTimeout);
            progressTimeout = setTimeout(() => {
                progressWrapper.classList.remove('show-progress');
            }, 3000);
        }

        function showVolumeHUD() {
            if (!vjsPlayer) return;
            volumeHud.innerText = `🔊 Volume: ${Math.round(vjsPlayer.volume() * 100)}%`;
            volumeHud.style.opacity = '1';
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => { volumeHud.style.opacity = '0'; }, 2000);
        }

        window.addEventListener('click', () => {
            if(vjsPlayer) vjsPlayer.muted(false);
            resetHideTimeout();
        });
        window.addEventListener('mousemove', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);

        async function loadM3U() {
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let tempChannel = null;

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('#EXTINF:')) {
                        const name = trimmed.split(',').pop() || "";
                        const logoMatch = trimmed.match(/tvg-logo="([^"]+)"/);

                        tempChannel = {
                            name: name.trim(),
                            logo: logoMatch ? logoMatch[1] : "",
                            url: ""
                        };
                    } else if (tempChannel && trimmed.startsWith('http')) {
                        tempChannel.url = trimmed;
                        channels.push(tempChannel);
                        tempChannel = null;
                    }
                });

                if (channels.length > 0) {
                    originalLength = channels.length;
                    channels = [...channels, ...channels, ...channels];

                    buildUI();
                    adjustScrollPadding();
                    currentIndex = originalLength;
                    setFocus(currentIndex, true);
                }
            } catch (err) {
                console.error("Erreur M3U:", err);
            }
        }

        function buildUI() {
            container.innerHTML = '';
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card`;
                card.id = `channel-${index}`;
                
                const realIndex = index % originalLength;
                const chNum = realIndex + 1;
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:30px;height:20px;background:rgba(255,255,255,0.08);border-radius:3px;"></div>`;

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${chNum}. ${channel.name}</div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(vjsPlayer) vjsPlayer.muted(false);
                    setFocus(index, true);
                });

                container.appendChild(card);
            });
        }

        function adjustScrollPadding() {
            const paddingValue = (container.clientHeight / 2) - 27;
            container.style.paddingTop = `${paddingValue}px`;
            container.style.paddingBottom = `${paddingValue}px`;
        }

        function setFocus(index, immediatePlay = false) {
            const cards = document.querySelectorAll('.channel-card');
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');
            
            currentIndex = index;
            
            if (currentIndex < originalLength) currentIndex += originalLength;
            if (currentIndex >= originalLength * 2) currentIndex -= originalLength;

            const activeCard = cards[currentIndex];
            if(activeCard) {
                activeCard.classList.add('focused');
                container.scrollTop = (activeCard.offsetTop - container.offsetTop) - (container.clientHeight / 2) + (activeCard.clientHeight / 2);
            }

            const realIndex = currentIndex % originalLength;
            const chNum = realIndex + 1;

            document.getElementById('center-channel-indicator').innerText = `CH.${chNum}`;
            document.getElementById('top-channel').innerText = `CHAINE ${chNum}`;

            resetHideTimeout();

            if (immediatePlay) {
                playChannel(currentIndex);
            } else {
                clearTimeout(autoplayTimeout);
                autoplayTimeout = setTimeout(() => { playChannel(currentIndex); }, 600);
            }
        }

        function playChannel(index) {
            const channel = channels[index];
            if (!channel || !vjsPlayer) return;

            loader.style.display = 'block';

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-playing'));
            const currentCard = document.getElementById(`channel-${index}`);
            if(currentCard) currentCard.classList.add('active-playing');

            // Lancement du flux avec Video.js
            vjsPlayer.src({
                src: channel.url,
                type: 'application/x-mpegURL' // Type M3U8 pour forcer la lecture HLS
            });
            
            vjsPlayer.play().catch(e => console.log("Lecture Video.js bloquée :", e));
        }

        window.addEventListener('resize', adjustScrollPadding);

        window.addEventListener('keydown', (e) => {
            if(vjsPlayer) vjsPlayer.muted(false); 

            if (e.key === 'ArrowUp') {
                setFocus(currentIndex - 1, true);
                e.preventDefault();
            } 
            else if (e.key === 'ArrowDown') {
                setFocus(currentIndex + 1, true);
                e.preventDefault();
            } 
            else if (e.key === 'ArrowLeft') {
                if(vjsPlayer) {
                    let newVol = Math.max(0, vjsPlayer.volume() - 0.1);
                    vjsPlayer.volume(newVol);
                }
                showVolumeHUD();
                e.preventDefault();
            } 
            else if (e.key === 'ArrowRight') {
                if(vjsPlayer) {
                    let newVol = Math.min(1, vjsPlayer.volume() + 0.1);
                    vjsPlayer.volume(newVol);
                }
                showVolumeHUD();
                e.preventDefault();
            } 
            else if (e.key === 'Enter') {
                resetHideTimeout();
                flashProgressBar();
                e.preventDefault();
            }
        });

        // Démarrage
        init();
    </script>
</body>
</html>
