<!DOCTYPE html>
<html lang="fr" data-theme="nuit">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pages. · Livre de Poche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root[data-theme="creme"] {
      --bg-page: #faf8f5;
      --text-primary: #1a1a1a;
      --text-secondary: #3a3a3a;
      --text-tertiary: #8a8a8a;
      --border-subtle: #eae5df;
      --accent: #1a1a1a;
      --accent-soft: #f0ebe4;
      --overlay-bg: rgba(250,248,245,0.9);
      --img-filter: none;
    }
    :root[data-theme="nuit"] {
      --bg-page: #121212;
      --text-primary: #f0f0f0;
      --text-secondary: #b3b3b3;
      --text-tertiary: #6b6b6b;
      --border-subtle: #2a2a2a;
      --accent: #ffffff;
      --accent-soft: #222222;
      --overlay-bg: rgba(18,18,18,0.9);
      --img-filter: brightness(0.85) contrast(1.1);
    }
    :root[data-theme="papier"] {
      --bg-page: #fdf6e3;
      --text-primary: #3e3a32;
      --text-secondary: #5a5446;
      --text-tertiary: #8e8679;
      --border-subtle: #e0d5bb;
      --accent: #3e3a32;
      --accent-soft: #f4ecd6;
      --overlay-bg: rgba(253,246,227,0.9);
      --img-filter: sepia(0.2) contrast(1.05);
    }
    :root[data-theme="lavande"] {
      --bg-page: #f7f5fb;
      --text-primary: #2b2540;
      --text-secondary: #4a4266;
      --text-tertiary: #8b83a8;
      --border-subtle: #e3dfed;
      --accent: #2b2540;
      --accent-soft: #efe9f7;
      --overlay-bg: rgba(247,245,251,0.9);
      --img-filter: none;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      background: var(--bg-page);
      font-family: 'Newsreader', Georgia, serif;
      touch-action: pan-y; /* Permet le défilement vertical natif */
      position: fixed;
      top: 0;
      left: 0;
    }
    
    .app-frame {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* En-tête plein écran */
    .app-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg-page);
      z-index: 20;
    }
    .logo-text {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      font-style: italic;
    }
    .header-tools {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tool-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      cursor: pointer;
    }
    .tool-btn:active {
      background: var(--accent-soft);
    }

    /* Scène du lecteur : prend tout l'espace restant */
    .reader-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg-page);
    }

    /* Disparition du style "carte" -> Rendu "Page" de liseuse */
    .page-card {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s ease, opacity 0.35s ease;
      overflow-y: auto;
      background: var(--bg-page);
      scrollbar-width: none; /* Firefox */
    }
    .page-card::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    /* Animations fluides comme un swipe d'application native */
    .page-active { transform: translateX(0); opacity: 1; z-index: 5; }
    .page-before { transform: translateX(-100%); opacity: 0; z-index: 2; pointer-events: none; }
    .page-after { transform: translateX(100%); opacity: 0; z-index: 2; pointer-events: none; }
    .page-slide-out-left { transform: translateX(-100%); opacity: 0; z-index: 10; }
    .page-slide-out-right { transform: translateX(100%); opacity: 0; z-index: 10; }

    /* Image pleine largeur (façon Article) */
    .page-cover-image {
      width: 100%;
      height: 35vh; /* Prend environ un tiers de l'écran */
      object-fit: cover;
      display: block;
      filter: var(--img-filter);
      flex-shrink: 0;
    }

    /* Contenu du texte façon Livre */
    .page-content {
      padding: 24px 24px 40px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .page-category {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
      font-weight: 500;
    }
    .page-title {
      font-size: 1.4rem; /* Plus petit, adapté mobile */
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 20px;
      letter-spacing: -0.2px;
      font-weight: 600;
    }
    .page-text {
      font-size: 0.95rem; /* Taille standard pour lecture de livre */
      line-height: 1.65;
      color: var(--text-secondary);
      flex: 1;
      text-align: justify; /* Justifié comme un vrai livre */
      hyphens: auto; /* Coupure des mots */
    }
    .page-text strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .page-text p {
      margin-bottom: 16px;
    }

    /* Pied de page discret */
    .reader-footer {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: var(--text-tertiary);
      background: var(--bg-page);
      flex-shrink: 0;
      text-transform: uppercase;
    }

    /* Menu Marque-pages */
    .bookmark-panel {
      position: absolute;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .panel-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .bookmark-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bookmark-row {
      background: transparent;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
    }
    .bookmark-row:last-child {
      border-bottom: none;
    }

    /* Notifications (Toast) */
    .toast-message {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-page);
      padding: 10px 24px;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }

    /* Écran de chargement */
    .splash {
      position: absolute;
      inset: 0;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
<div class="app-frame" id="appFrame">
  <div class="splash" id="splashScreen">
    <div style="font-size: 2.2rem; font-style: italic; font-weight: 600;">Pages.</div>
    <div style="margin-top: 12px; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-secondary);">Chargement...</div>
  </div>
  
  <header class="app-header">
    <span class="logo-text">Pages.</span>
    <div class="header-tools">
      <button class="tool-btn" id="btnBookmarks" aria-label="Signets"><i class="far fa-bookmark"></i></button>
      <button class="tool-btn" id="btnTheme" aria-label="Thème"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <div class="reader-stage" id="readerStage">
    <div class="page-card page-active" id="pageCardA"></div>
    <div class="page-card" id="pageCardB" style="display:none;"></div>
  </div>

  <div class="reader-footer">
    <span id="pageCounter">Page 1</span>
  </div>

  <div class="bookmark-panel" id="bookmarkPanel">
    <div class="panel-header">
      <span>Marque-pages</span>
      <button class="tool-btn" id="closeBookmarkPanel"><i class="fas fa-times"></i></button>
    </div>
    <div class="bookmark-list" id="bookmarkListContainer"></div>
  </div>

  <div class="toast-message" id="toast"></div>
</div>

<script>
  (function() {
    let BOOK_PAGES = [];
    const DATA_URL = 'livre.txt';

    const STORAGE_KEY_PAGE = "pgs_current_page";
    const STORAGE_KEY_BM = "pgs_bookmarks";

    let currentPageIndex = 0;
    let activeCard = 'A';
    let isAnimating = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeHandled = false;

    // Ordre des thèmes
    const themes = ['nuit', 'creme', 'papier', 'lavande'];
    const themeIcons = ['fa-moon', 'fa-sun', 'fa-leaf', 'fa-feather'];
    let themeIndex = 0;

    const pageCardA = document.getElementById('pageCardA');
    const pageCardB = document.getElementById('pageCardB');
    const pageCounter = document.getElementById('pageCounter');
    const toast = document.getElementById('toast');
    const bookmarkPanel = document.getElementById('bookmarkPanel');
    const bookmarkListContainer = document.getElementById('bookmarkListContainer');
    const splashScreen = document.getElementById('splashScreen');
    const btnBookmarks = document.getElementById('btnBookmarks');
    const btnTheme = document.getElementById('btnTheme');
    const closeBookmarkPanel = document.getElementById('closeBookmarkPanel');
    const readerStage = document.getElementById('readerStage');

    function safeGet(key) { try { return localStorage.getItem(key); } catch(e) { return null; } }
    function safeSet(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }

    function renderPageInto(cardElement, pageData) {
      if (!pageData) return;
      const imageHtml = pageData.image
        ? `<img class="page-cover-image" src="${pageData.image}" alt="illustration">`
        : '';
      cardElement.innerHTML = `
        ${imageHtml}
        <div class="page-content">
          <div class="page-category">${pageData.category || ''}</div>
          <div class="page-title">${pageData.title || ''}</div>
          <div class="page-text">${pageData.text || ''}</div>
        </div>
      `;
    }

    function getActiveCardElement() { return activeCard === 'A' ? pageCardA : pageCardB; }
    function getInactiveCardElement() { return activeCard === 'A' ? pageCardB : pageCardA; }

    function updatePageDisplay() {
      pageCounter.textContent = `Page ${currentPageIndex + 1} sur ${BOOK_PAGES.length}`;
      safeSet(STORAGE_KEY_PAGE, currentPageIndex);
      updateBookmarkButtonState();
    }

    function initialRender() {
      if (!BOOK_PAGES.length) return;
      renderPageInto(pageCardA, BOOK_PAGES[currentPageIndex]);
      pageCardA.className = 'page-card page-active';
      pageCardB.style.display = 'none';
      pageCardB.className = 'page-card';
      activeCard = 'A';
      updatePageDisplay();
    }

    function animateTransition(direction) {
      if (isAnimating || !BOOK_PAGES.length) return;
      if (direction === 'next' && currentPageIndex >= BOOK_PAGES.length - 1) {
        showToastMessage('Fin du livre');
        return;
      }
      if (direction === 'prev' && currentPageIndex <= 0) {
        showToastMessage('Début du livre');
        return;
      }
      isAnimating = true;
      const oldCard = getActiveCardElement();
      const newCard = getInactiveCardElement();
      const newIndex = direction === 'next' ? currentPageIndex + 1 : currentPageIndex - 1;
      
      renderPageInto(newCard, BOOK_PAGES[newIndex]);
      newCard.scrollTop = 0; // Remet la nouvelle page en haut

      oldCard.classList.remove('page-active');
      newCard.style.display = 'flex';
      newCard.classList.remove('page-before', 'page-after', 'page-slide-out-left', 'page-slide-out-right');

      if (direction === 'next') {
        oldCard.classList.add('page-slide-out-left');
        newCard.classList.add('page-after');
        void newCard.offsetWidth;
        newCard.classList.remove('page-after');
        newCard.classList.add('page-active');
      } else {
        oldCard.classList.add('page-slide-out-right');
        newCard.classList.add('page-before');
        void newCard.offsetWidth;
        newCard.classList.remove('page-before');
        newCard.classList.add('page-active');
      }

      setTimeout(() => {
        oldCard.style.display = 'none';
        oldCard.classList.remove('page-slide-out-left', 'page-slide-out-right');
        activeCard = activeCard === 'A' ? 'B' : 'A';
        currentPageIndex = newIndex;
        updatePageDisplay();
        isAnimating = false;
      }, 350); // Vitesse de l'animation ajustée
    }

    function goToNextPage() { animateTransition('next'); }
    function goToPrevPage() { animateTransition('prev'); }

    function handleTouchStart(e) {
      if (isAnimating) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swipeHandled = false;
    }
    function handleTouchMove(e) {
      if (isAnimating || swipeHandled) return;
      // Permet le scroll vertical (si l'utilisateur scrolle le texte, on ne change pas de page)
      const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
      const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
      if (deltaY > deltaX) return; 
    }
    function handleTouchEnd(e) {
      if (isAnimating || swipeHandled) return;
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
      
      // On s'assure que c'est un swipe horizontal clair, pas un scroll
      if (deltaY < 30) {
        const threshold = 50;
        if (deltaX < -threshold) { swipeHandled = true; goToNextPage(); }
        else if (deltaX > threshold) { swipeHandled = true; goToPrevPage(); }
      }
    }

    function getBookmarks() {
      const raw = safeGet(STORAGE_KEY_BM);
      return raw ? JSON.parse(raw) : [];
    }
    function saveBookmarks(bookmarks) { safeSet(STORAGE_KEY_BM, JSON.stringify(bookmarks)); }
    function isCurrentPageBookmarked() { return getBookmarks().includes(currentPageIndex); }

    function toggleBookmark() {
      const bookmarks = getBookmarks();
      const index = bookmarks.indexOf(currentPageIndex);
      if (index > -1) {
        bookmarks.splice(index, 1);
        showToastMessage('Signet retiré');
      } else {
        bookmarks.push(currentPageIndex);
        showToastMessage('Page marquée');
      }
      saveBookmarks(bookmarks);
      updateBookmarkButtonState();
    }

    function updateBookmarkButtonState() {
      const icon = btnBookmarks.querySelector('i');
      if (isCurrentPageBookmarked()) {
        icon.className = 'fas fa-bookmark';
      } else {
        icon.className = 'far fa-bookmark';
      }
    }

    function openBookmarkPanel() {
      const bookmarks = getBookmarks();
      bookmarkListContainer.innerHTML = '';
      if (bookmarks.length === 0) {
        bookmarkListContainer.innerHTML = '<div style="padding:20px;text-align:center;font-family:\'Inter\', sans-serif;color:var(--text-tertiary);">Aucun signet enregistré.</div>';
      } else {
        bookmarks.sort((a,b) => a-b).forEach(idx => {
          const page = BOOK_PAGES[idx];
          const div = document.createElement('div');
          div.className = 'bookmark-row';
          div.innerHTML = `
            <div>
              <div style="font-family:'Inter', sans-serif; font-size:0.85rem; font-weight:600; color:var(--text-primary); text-transform:uppercase; letter-spacing:1px;">Page ${idx+1}</div>
              <div style="font-family:'Newsreader', serif; font-size:1.1rem; color:var(--text-secondary); margin-top:4px;">${page.title || 'Sans titre'}</div>
            </div>
          `;
          div.addEventListener('click', () => {
            navigateToPage(idx);
            closeBookmarkPanelFn();
          });
          bookmarkListContainer.appendChild(div);
        });
      }
      bookmarkPanel.style.display = 'flex';
    }

    function closeBookmarkPanelFn() { bookmarkPanel.style.display = 'none'; }

    function navigateToPage(index) {
      if (index === currentPageIndex || isAnimating || !BOOK_PAGES.length) return;
      const direction = index > currentPageIndex ? 'next' : 'prev';
      const oldIndex = currentPageIndex;
      const newCard = getInactiveCardElement();
      renderPageInto(newCard, BOOK_PAGES[index]);
      currentPageIndex = oldIndex;
      animateTransition(direction);
    }

    function cycleTheme() {
      themeIndex = (themeIndex + 1) % themes.length;
      const theme = themes[themeIndex];
      document.documentElement.setAttribute('data-theme', theme);
      btnTheme.querySelector('i').className = `fas ${themeIcons[themeIndex]}`;
      const themeNames = ['Nuit', 'Crème', 'Papier', 'Lavande'];
      showToastMessage(`${themeNames[themeIndex]}`);
    }

    function showToastMessage(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function restoreSession() {
      const saved = safeGet(STORAGE_KEY_PAGE);
      if (saved !== null) {
        const parsed = parseInt(saved, 10);
        if (!isNaN(parsed) && parsed >= 0 && parsed < BOOK_PAGES.length) {
          currentPageIndex = parsed;
        }
      }
      initialRender();
      splashScreen.style.display = 'none';
    }

    async function loadBookData() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error('Fichier introuvable');
        const data = await response.json();
        if (data.pages && Array.isArray(data.pages)) {
          BOOK_PAGES = data.pages;
        } else if (Array.isArray(data)) {
          BOOK_PAGES = data;
        } else {
          throw new Error('Format JSON invalide');
        }
        restoreSession();
      } catch (err) {
        console.error('Erreur chargement livre.txt:', err);
        splashScreen.innerHTML = '<div style="font-size:1.2rem; text-align:center; padding:30px; font-family:\'Inter\', sans-serif;">Impossible de charger le livre.<br><span style="font-size:0.9rem; color:var(--text-secondary); margin-top:10px; display:block;">Vérifiez que livre.txt est bien hébergé au même endroit.</span></div>';
      }
    }

    readerStage.addEventListener('touchstart', handleTouchStart, {passive: true});
    readerStage.addEventListener('touchmove', handleTouchMove, {passive: true});
    readerStage.addEventListener('touchend', handleTouchEnd);

    btnBookmarks.addEventListener('click', (e) => { e.stopPropagation(); openBookmarkPanel(); });
    closeBookmarkPanel.addEventListener('click', (e) => { e.stopPropagation(); closeBookmarkPanelFn(); });
    btnTheme.addEventListener('click', (e) => { e.stopPropagation(); cycleTheme(); });
    
    // Tap long ou double tap sur le signet pour l'ajouter/retirer rapidement
    btnBookmarks.addEventListener('dblclick', (e) => { e.stopPropagation(); toggleBookmark(); });
    let pressTimer;
    btnBookmarks.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { toggleBookmark(); }, 600); }, {passive: true});
    btnBookmarks.addEventListener('touchend', () => clearTimeout(pressTimer));
    btnBookmarks.addEventListener('touchmove', () => clearTimeout(pressTimer));

    bookmarkPanel.addEventListener('click', (e) => { if (e.target === bookmarkPanel) closeBookmarkPanelFn(); });

    loadBookData();
  })();
</script>
</body>
</html>
