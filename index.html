<!DOCTYPE html> 
<html lang="fr" data-theme="creme"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Pages. · Lecteur Mobile</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
    <style> 
        :root[data-theme="creme"] { 
            --bg-page: #faf8f5; --text-primary: #1a1a1a; --text-secondary: #333333; --text-tertiary: #8a8a8a; 
            --border-subtle: #eae5df; --accent-soft: rgba(0, 0, 0, 0.04); --overlay-bg: rgba(250, 248, 245, 0.75); 
        } 
        :root[data-theme="nuit"] { 
            --bg-page: #121212; --text-primary: #f0f0f0; --text-secondary: #c4c4c4; --text-tertiary: #888888; 
            --border-subtle: #2a2a2a; --accent-soft: #1e1e1e; --overlay-bg: rgba(18, 18, 18, 0.75); 
        } 
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-page); font-family: 'Newsreader', Georgia, serif; position: fixed; top: 0; left: 0; } 
        
        .app-frame { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; } 
        
        /* Header */ 
        .overlay-header { position: absolute; top: 0; left: 0; width: 100%; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 50; background: var(--overlay-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-subtle); } 
        .logo-text { font-family: 'Newsreader', serif; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.5px; color: var(--text-primary); font-style: italic; } 
        .tool-btn { background: var(--accent-soft); border: 1px solid var(--border-subtle); color: var(--text-primary); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; } 
        
        /* Lecteur Stage */ 
        .reader-stage { flex: 1; width: 100%; position: relative; padding-top: 65px; /* Espace pour le header */ padding-bottom: 70px; /* Espace pour navigation si présente */ } 
        .page-card { width: 100%; height: 100%; position: absolute; top: 65px; left: 0; display: flex; flex-direction: column; transition: transform 0.35s ease, opacity 0.35s ease; overflow-y: auto; background: var(--bg-page); padding: 24px; padding-bottom: 100px; scrollbar-width: none; } 
        .page-card::-webkit-scrollbar { display: none; } 
        
        /* Animations de changement de page (Livre) */
        .page-active { transform: translateX(0); opacity: 1; z-index: 5; } 
        .page-before { transform: translateX(-100%); opacity: 0; z-index: 2; pointer-events: none; } 
        .page-after { transform: translateX(100%); opacity: 0; z-index: 2; pointer-events: none; } 
        .page-slide-out-left { transform: translateX(-100%); opacity: 0; z-index: 10; } 
        .page-slide-out-right { transform: translateX(100%); opacity: 0; z-index: 10; } 
        
        /* Styles du Contenu HTML formaté par Writer */
        .page-card h3 { font-family: 'Inter', sans-serif; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-tertiary); margin-bottom: 12px; } 
        .page-card h2 { font-size: 2.2rem; line-height: 1.15; color: var(--text-primary); font-weight: 700; margin-bottom: 24px; } 
        .page-card p { font-size: 1.05rem; line-height: 1.7; color: var(--text-secondary); text-align: justify; margin-bottom: 18px; text-indent: 20px; } 
        .page-card p:first-of-type { text-indent: 0; }
        .page-card img { width: 100%; max-height: 35vh; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        
        /* Styles Format Posts/Feed */
        .post-feed { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; } 
        .post-card { background: var(--accent-soft); border-radius: 16px; padding: 20px; border: 1px solid var(--border-subtle); } 
        .post-meta { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--text-tertiary); } 
        .post-category { color: var(--text-primary); font-weight: 600; text-transform: uppercase; } 
        .post-title { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; } 
        .post-author { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: var(--text-tertiary); margin-bottom: 14px; } 
        .post-body { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; font-family: 'Inter', sans-serif; } 
        
        /* Indicateur de page flottant */ 
        .page-indicator { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 30px; font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; color: var(--text-primary); background: var(--overlay-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); z-index: 20; pointer-events: none; } 
        
        /* ----- BOTTOM NAVIGATION BAR (Conditionnelle) ----- */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--bg-page); border-top: 1px solid var(--border-subtle); display: none; align-items: center; justify-content: center; gap: 40px; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-tertiary); font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.2s; gap: 6px; }
        .nav-item i { font-size: 1.4rem; }
        .nav-item.active { color: var(--text-primary); }

        .splash { position: absolute; inset: 0; background: var(--bg-page); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; color: var(--text-primary); font-size: 2.5rem; font-style: italic; font-weight: 700; transition: 0.4s; } 
        .splash span { font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 400; font-style: normal; color: var(--text-tertiary); margin-top: 10px; }
    </style> 
</head> 
<body> 
    <div class="app-frame" id="appFrame"> 
        <div class="splash" id="splashScreen">Pages.<br><span id="splashText">Recherche de contenus...</span></div> 
        
        <header class="overlay-header"> 
            <!-- Ton client pourra changer ce nom dans le HTML -->
            <span class="logo-text" id="appTitle">Pages.</span> 
            <div class="header-tools"> 
                <button class="tool-btn" onclick="cycleTheme()"><i class="fas fa-moon"></i></button> 
            </div> 
        </header> 
        
        <div class="reader-stage" id="readerStage"> 
            <div class="page-card page-active" id="pageCardA"></div> 
            <div class="page-card" id="pageCardB" style="display:none;"></div> 
        </div> 
        
        <div class="page-indicator" id="pageCounter">1 / 1</div> 
        
        <!-- BARRE DE NAVIGATION (S'affiche si Livre ET Post existent) -->
        <div class="bottom-nav" id="bottomNav">
            <div class="nav-item active" id="navLivre" onclick="switchMode('book')">
                <i class="fas fa-book-open"></i>Livre
            </div>
            <div class="nav-item" id="navPost" onclick="switchMode('posts')">
                <i class="fas fa-layer-group"></i>Actualités
            </div>
        </div>
    </div> 
    
    <script> 
        // ===============================================
        // MOTEUR DU LECTEUR PAGES.
        // ===============================================

        let bookData = null;  // Données de livre.json
        let postData = null;  // Données de post.json
        
        let currentMode = 'book'; // 'book' ou 'posts'
        let currentPages = [];
        let currentPageIndex = 0; 
        
        let activeCard = 'A'; 
        let isAnimating = false; 
        let touchStartX = 0; let touchStartY = 0;
        let swipeHandled = false; 
        
        const pageCardA = document.getElementById('pageCardA'); 
        const pageCardB = document.getElementById('pageCardB'); 
        const pageCounter = document.getElementById('pageCounter'); 
        
        // --- 1. TÉLÉCHARGEMENT DES FICHIERS JSON ---
        async function loadContent() {
            // Tente de charger les deux fichiers simultanément
            const [livreRes, postRes] = await Promise.allSettled([
                fetch('livre.json').then(r => r.json()),
                fetch('post.json').then(r => r.json())
            ]);

            if (livreRes.status === 'fulfilled') bookData = livreRes.value;
            if (postRes.status === 'fulfilled') postData = postRes.value;

            // Si les deux fichiers sont présents, afficher la barre de navigation
            if (bookData && postData) {
                document.getElementById('bottomNav').style.display = 'flex';
            }

            // Déterminer quoi afficher en premier
            if (bookData) {
                switchMode('book');
            } else if (postData) {
                switchMode('posts');
            } else {
                document.getElementById('splashText').innerText = "Aucun fichier (livre.json ou post.json) trouvé.";
                return;
            }
            
            // Cacher l'écran de chargement
            setTimeout(() => {
                document.getElementById('splashScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 400);
            }, 500);
        }

        // --- 2. GESTION DE L'AFFICHAGE (Livre vs Post) ---
        function switchMode(mode) {
            currentMode = mode;
            currentPageIndex = 0;
            
            if (mode === 'book' && bookData) {
                document.getElementById('appTitle').innerText = bookData.titre || "Livre";
                currentPages = bookData.pages_pretes || [];
                pageCounter.style.display = 'block';
                if(document.getElementById('navLivre')) {
                    document.getElementById('navLivre').classList.add('active');
                    document.getElementById('navPost').classList.remove('active');
                }
            } 
            else if (mode === 'posts' && postData) {
                document.getElementById('appTitle').innerText = postData.titre || "Actualités";
                // Les posts s'affichent sur UNE seule longue page pour scroller
                currentPages = [generatePostsHTML(postData.items)];
                pageCounter.style.display = 'none'; // Pas de numérotation pour les posts continus
                if(document.getElementById('navPost')) {
                    document.getElementById('navPost').classList.add('active');
                    document.getElementById('navLivre').classList.remove('active');
                }
            }
            
            initialRender();
        }

        function generatePostsHTML(items) {
            if(!items || items.length === 0) return "<p>Aucune publication.</p>";
            let html = '<div class="post-feed">';
            items.forEach(post => {
                html += `
                    <div class="post-card">
                        <div class="post-meta">
                            <span class="post-category">${post.category || 'Information'}</span>
                            <span>${post.date || ''}</span>
                        </div>
                        <div class="post-title">${post.title || ''}</div>
                        ${post.author ? `<div class="post-author">Par ${post.author}</div>` : ''}
                        ${post.image ? `<img src="${post.image}" style="width:100%; border-radius:10px; margin-bottom:15px;">` : ''}
                        <div class="post-body">${post.text ? post.text.replace(/\n/g, '<br>') : ''}</div>
                    </div>`;
            });
            html += '</div>';
            return html;
        }

        // --- 3. MOTEUR DE RENDU DU LECTEUR ---
        function getActiveCard() { return activeCard === 'A' ? pageCardA : pageCardB; } 
        function getInactiveCard() { return activeCard === 'A' ? pageCardB : pageCardA; } 

        function initialRender() { 
            const card = getActiveCard();
            card.innerHTML = currentPages[currentPageIndex] || "<p>Page vide.</p>"; 
            card.scrollTop = 0;
            
            pageCardA.className = activeCard === 'A' ? 'page-card page-active' : 'page-card'; 
            pageCardB.className = activeCard === 'B' ? 'page-card page-active' : 'page-card'; 
            pageCardA.style.display = activeCard === 'A' ? 'flex' : 'none';
            pageCardB.style.display = activeCard === 'B' ? 'flex' : 'none';
            
            if(currentMode === 'book') pageCounter.textContent = `${currentPageIndex + 1} / ${currentPages.length}`; 
        } 
        
        function animateTransition(direction) { 
            // Ne pas tourner de page si on est en mode "posts" (car tout est sur 1 page verticale)
            if (currentMode === 'posts') return;
            if (isAnimating || currentPages.length === 0) return; 
            if (direction === 'next' && currentPageIndex >= currentPages.length - 1) return; 
            if (direction === 'prev' && currentPageIndex <= 0) return; 
            
            isAnimating = true; 
            const oldCard = getActiveCard(); 
            const newCard = getInactiveCard(); 
            const newIndex = direction === 'next' ? currentPageIndex + 1 : currentPageIndex - 1; 
            
            newCard.innerHTML = currentPages[newIndex]; 
            newCard.scrollTop = 0;
            
            oldCard.classList.remove('page-active'); 
            newCard.style.display = 'flex'; 
            newCard.classList.remove('page-before', 'page-after', 'page-slide-out-left', 'page-slide-out-right'); 
            
            if (direction === 'next') { 
                oldCard.classList.add('page-slide-out-left'); 
                newCard.classList.add('page-after'); 
                void newCard.offsetWidth; 
                newCard.classList.remove('page-after'); 
                newCard.classList.add('page-active'); 
            } else { 
                oldCard.classList.add('page-slide-out-right'); 
                newCard.classList.add('page-before'); 
                void newCard.offsetWidth; 
                newCard.classList.remove('page-before'); 
                newCard.classList.add('page-active'); 
            } 
            
            setTimeout(() => { 
                oldCard.style.display = 'none'; 
                oldCard.classList.remove('page-slide-out-left', 'page-slide-out-right'); 
                activeCard = activeCard === 'A' ? 'B' : 'A'; 
                currentPageIndex = newIndex; 
                if(currentMode === 'book') pageCounter.textContent = `${currentPageIndex + 1} / ${currentPages.length}`; 
                isAnimating = false; 
            }, 350); 
        } 
        
        // --- 4. GESTES TACTILES ---
        const readerStage = document.getElementById('readerStage');
        
        readerStage.addEventListener('touchstart', e => { 
            if (isAnimating) return; 
            touchStartX = e.touches[0].clientX; 
            touchStartY = e.touches[0].clientY; 
            swipeHandled = false; 
        }, {passive: true}); 
        
        readerStage.addEventListener('touchmove', e => { 
            if (isAnimating || swipeHandled) return; 
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY); 
            const deltaX = Math.abs(e.touches[0].clientX - touchStartX); 
            // Si le défilement est vertical, on annule le swipe pour laisser l'utilisateur lire
            if (deltaY > deltaX) swipeHandled = true; 
        }, {passive: true}); 
        
        readerStage.addEventListener('touchend', e => { 
            if (isAnimating || swipeHandled || currentMode === 'posts') return; 
            const deltaX = e.changedTouches[0].clientX - touchStartX; 
            if (deltaX < -50) animateTransition('next'); 
            else if (deltaX > 50) animateTransition('prev'); 
        }); 

        // --- 5. THEME ---
        function cycleTheme() { 
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'creme' ? 'nuit' : 'creme');
        } 
        
        // Lancement
        window.onload = loadContent;
    </script> 
</body> 
</html>
