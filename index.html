<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.0.0"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(25, 25, 30, 0.7);
            --card-hover: rgba(40, 40, 50, 0.85);
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000000;
        }

        #loader {
            position: absolute;
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 3;
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #epg-overlay {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 15px;
            border-right: 4px solid var(--accent-neon);
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
            max-width: 300px;
            opacity: 0;
        }
        #epg-overlay h2 { margin: 0 0 4px 0; font-size: 16px; font-weight: bold; }
        #epg-overlay p { margin: 0; color: var(--text-secondary); font-size: 12px; }

        #channels-container {
            position: absolute;
            top: 0; left: 0;
            width: 290px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.95) 80%, rgba(0,0,0,0));
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px 15px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 5;
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateX(0);
            opacity: 1;
        }

        #channels-container.hidden {
            transform: translateX(-100%);
            opacity: 0;
        }

        #channels-container::-webkit-scrollbar { display: none; }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .channel-card img {
            width: 50px; height: 35px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .channel-name {
            font-size: 13px;
            font-weight: bold;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .channel-group {
            font-size: 10px;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            overflow: hidden;
            margin-top: 2px;
        }

        .channel-card.focused, .channel-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: var(--card-hover);
        }

        .channel-card.active {
            background: rgba(57, 255, 20, 0.15);
            border-color: var(--accent-neon);
        }
        .channel-card.active .channel-name {
            color: var(--accent-neon);
        }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="loader"></div>
        <video id="video" autoplay playsinline loop muted></video>
        
        <div id="epg-overlay">
            <h2 id="overlay-channel">-</h2>
            <p id="overlay-program">-</p>
        </div>
    </div>

    <div id="channels-container"></div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/XcaliBuild/live-player/refs/heads/main/FreeSportTV.m3u";
        
        let channels = [];
        let currentIndex = 0;
        let hideTimeout;
        
        const video = document.getElementById('video');
        const container = document.getElementById('channels-container');
        const overlay = document.getElementById('epg-overlay');
        const loader = document.getElementById('loader');
        let hls = null;

        async function init() {
            await loadM3U();
            resetHideTimeout();
            
            video.addEventListener('waiting', () => loader.style.display = 'block');
            video.addEventListener('playing', () => {
                loader.style.display = 'none';
                video.muted = false;
            });
            video.addEventListener('loadstart', () => loader.style.display = 'block');
        }

        function resetHideTimeout() {
            showSidebar();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideSidebar(); }, 3500);
        }

        function showSidebar() { container.classList.remove('hidden'); }
        function hideSidebar() { container.classList.add('hidden'); }

        window.addEventListener('click', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);

        // Analyse directe et propre du M3U de GitHub
        async function loadM3U() {
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let currentChannel = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const name = line.split(',')[1] || "";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const groupMatch = line.match(/group-title="([^"]+)"/);

                        currentChannel = {
                            name: name.trim(),
                            logo: logoMatch ? logoMatch[1] : "",
                            group: groupMatch ? groupMatch[1] : "",
                            url: ""
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                });

                if (channels.length > 0) {
                    buildUI();
                    playChannel(0);
                }
            } catch (err) {
                console.error("Erreur de chargement M3U:", err);
            }
        }

        function buildUI() {
            container.innerHTML = '';
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card ${index === 0 ? 'focused' : ''}`;
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:50px;height:35px;background:rgba(255,255,255,0.08);border-radius:6px;"></div>`;

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-group">${channel.group}</div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setFocus(index);
                    playChannel(index);
                    resetHideTimeout();
                });

                container.appendChild(card);
            });
        }

        function setFocus(index) {
            const cards = document.querySelectorAll('.channel-card');
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');
            
            currentIndex = index;
            const activeCard = cards[currentIndex];
            if(activeCard) {
                activeCard.classList.add('focused');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function playChannel(index) {
            const channel = channels[index];
            if (!channel) return;

            loader.style.display = 'block';

            document.getElementById('overlay-channel').innerText = channel.name;
            
            if (channel.group) {
                document.getElementById('overlay-program').innerText = channel.group;
                overlay.style.opacity = "1";
                clearTimeout(window.overlayTimeout);
                window.overlayTimeout = setTimeout(() => { overlay.style.opacity = "0"; }, 4000);
            } else {
                overlay.style.opacity = "0";
            }

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            const currentCard = document.querySelectorAll('.channel-card')[index];
            if(currentCard) currentCard.classList.add('active');

            if (hls) { hls.destroy(); }

            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 10,
                    maxMaxBufferLength: 20,
                    enableWorker: false,
                    lowLatencyMode: true
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        window.addEventListener('keydown', (e) => {
            resetHideTimeout();
            if (e.key === 'ArrowUp') {
                if (currentIndex > 0) { setFocus(currentIndex - 1); playChannel(currentIndex); }
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                if (currentIndex < channels.length - 1) { setFocus(currentIndex + 1); playChannel(currentIndex); }
                e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
                showSidebar();
                e.preventDefault();
            } else if (e.key === 'Enter') {
                playChannel(currentIndex);
                e.preventDefault();
            }
        });

        init();
    </script>
</body>
</html>
