<!DOCTYPE html> 
<html lang="fr" data-theme="creme"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"> 
    <title>Pages. · App Engine</title> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <style> 
        :root[data-theme="creme"] { 
            --bg-page: #faf8f5; --text-primary: #1a1a1a; --text-secondary: #333333; --text-tertiary: #8a8a8a; 
            --border-subtle: #eae5df; --accent-soft: rgba(0, 0, 0, 0.04); --overlay-bg: rgba(250, 248, 245, 0.85); 
        } 
        :root[data-theme="nuit"] { 
            --bg-page: #121212; --text-primary: #f0f0f0; --text-secondary: #c4c4c4; --text-tertiary: #888888; 
            --border-subtle: #2a2a2a; --accent-soft: #1e1e1e; --overlay-bg: rgba(18, 18, 18, 0.85); 
        } 
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg-page); font-family: 'Newsreader', serif; position: fixed; top: 0; left: 0; transition: background 0.3s; } 
        
        .app-frame { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; } 
        
        .overlay-header { position: absolute; top: 0; left: 0; width: 100%; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 50; background: var(--overlay-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border-subtle); } 
        .logo-text { font-family: 'Newsreader', serif; font-weight: 700; font-size: 1.6rem; letter-spacing: -0.5px; color: var(--text-primary); font-style: italic; } 
        .tool-btn { background: var(--accent-soft); border: 1px solid var(--border-subtle); color: var(--text-primary); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; } 
        
        .reader-stage { flex: 1; width: 100%; position: relative; padding-top: 65px; padding-bottom: 70px; } 
        .page-card { width: 100%; height: 100%; position: absolute; top: 65px; left: 0; display: flex; flex-direction: column; transition: transform 0.35s ease, opacity 0.35s ease; overflow-y: auto; background: var(--bg-page); padding: 24px; padding-bottom: 100px; scrollbar-width: none; } 
        .page-card::-webkit-scrollbar { display: none; } 
        
        .page-active { transform: translateX(0); opacity: 1; z-index: 5; } 
        .page-before { transform: translateX(-100%); opacity: 0; z-index: 2; } 
        .page-after { transform: translateX(100%); opacity: 0; z-index: 2; } 
        .page-slide-out-left { transform: translateX(-100%); opacity: 0; z-index: 10; } 
        .page-slide-out-right { transform: translateX(100%); opacity: 0; z-index: 10; } 
        
        /* STYLES PAR FORMAT */
        /* Format Book/Magazine */
        .fmt-text h3 { font-family: 'Inter', sans-serif; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-tertiary); margin-bottom: 12px; } 
        .fmt-text h2 { font-size: 2.2rem; line-height: 1.15; color: var(--text-primary); margin-bottom: 24px; } 
        .fmt-text p { font-size: 1.1rem; line-height: 1.6; color: var(--text-secondary); text-align: justify; margin-bottom: 18px; text-indent: 20px; } 
        .fmt-text p:first-of-type { text-indent: 0; }
        .fmt-text img { width: 100%; max-height: 35vh; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        
        /* Format BD */
        .fmt-bd { padding: 0 !important; background: #000; }
        .fmt-bd img { width: 100%; height: 100%; object-fit: contain; }
        .fmt-bd .bd-text { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 0.9rem; text-align: center;}

        /* Format Post / Scroll */
        .post-feed { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; } 
        .post-card { background: var(--accent-soft); border-radius: 16px; padding: 20px; border: 1px solid var(--border-subtle); } 
        .post-meta { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--text-tertiary); margin-bottom: 10px; } 
        .post-title { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; } 
        
        .page-indicator { position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 30px; font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 600; color: var(--text-primary); background: var(--overlay-bg); border: 1px solid var(--border-subtle); z-index: 20; pointer-events: none; } 
        
        /* BOTTOM NAV DYNAMIQUE */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: var(--bg-page); border-top: 1px solid var(--border-subtle); display: none; align-items: center; justify-content: space-evenly; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-tertiary); font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: 0.2s; gap: 4px; }
        .nav-item i { font-size: 1.4rem; }
        .nav-item.active { color: var(--text-primary); }

        .splash { position: absolute; inset: 0; background: var(--bg-page); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; color: var(--text-primary); font-size: 2.5rem; font-style: italic; font-weight: 700; transition: 0.4s; } 
    </style> 
</head> 
<body> 
    <div class="app-frame"> 
        <div class="splash" id="splashScreen">Pages.<br><span style="font-size:0.9rem; font-family:'Inter'; color:var(--text-tertiary); margin-top:10px; font-style:normal;">Initialisation de l'App...</span></div> 
        
        <header class="overlay-header"> 
            <span class="logo-text" id="appTitle">Pages.</span> 
            <div class="header-tools"> 
                <button class="tool-btn" onclick="cycleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button> 
            </div> 
        </header> 
        
        <div class="reader-stage" id="readerStage"> 
            <div class="page-card page-active" id="pageCardA"></div> 
            <div class="page-card" id="pageCardB" style="display:none;"></div> 
        </div> 
        
        <div class="page-indicator" id="pageCounter" style="display:none;">1 / 1</div> 
        
        <div class="bottom-nav" id="bottomNav"></div>
    </div> 
    
    <script> 
        // ===============================================
        // MOTEUR INTELLIGENT DE LECTURE JSON
        // ===============================================

        let availableApps = {}; // Stockera les données téléchargées
        let currentMode = ''; 
        let currentPages = [];
        let currentPageIndex = 0; 
        
        let activeCard = 'A'; 
        let isAnimating = false; 
        let touchStartX = 0; let touchStartY = 0;
        
        const pageCardA = document.getElementById('pageCardA'); 
        const pageCardB = document.getElementById('pageCardB'); 
        const pageCounter = document.getElementById('pageCounter'); 
        const bottomNav = document.getElementById('bottomNav');
        
        // 1. CHERCHER TOUS LES FICHIERS DE L'AUTEUR
        async function loadContent() {
            const filesToTry = [
                { name: 'Livre', file: 'livre.json', icon: 'fa-book' },
                { name: 'BD', file: 'bd.json', icon: 'fa-mask' },
                { name: 'Magazine', file: 'magazine.json', icon: 'fa-th-large' },
                { name: 'Actus', file: 'post.json', icon: 'fa-layer-group' }
            ];

            // Tente de tout télécharger
            const promises = filesToTry.map(f => fetch(f.file).then(res => {
                if(!res.ok) throw new Error(); return res.json();
            }).then(data => ({ meta: f, data: data })).catch(() => null));

            const results = await Promise.all(promises);
            
            // On filtre ceux qui ont réussi
            const validResults = results.filter(r => r !== null);

            if(validResults.length === 0) {
                document.getElementById('splashScreen').innerHTML = "Aucun JSON trouvé.<br><span style='font-size:14px;font-family:Inter;'>Ajoutez livre.json ou bd.json</span>";
                return;
            }

            // On stocke et on construit le menu du bas
            validResults.forEach(res => {
                availableApps[res.data.format] = res.data;
            });

            buildBottomNav(validResults);
            
            // On lance le premier format trouvé
            switchFormat(validResults[0].data.format);

            setTimeout(() => {
                document.getElementById('splashScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 400);
            }, 500);
        }

        // 2. CRÉATION DU MENU (S'il y a plusieurs fichiers)
        function buildBottomNav(results) {
            if(results.length <= 1) return; // Pas besoin de menu pour 1 seul fichier
            
            bottomNav.style.display = 'flex';
            results.forEach(res => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.id = `nav-${res.data.format}`;
                div.innerHTML = `<i class="fas ${res.meta.icon}"></i><span>${res.meta.name}</span>`;
                div.onclick = () => switchFormat(res.data.format);
                bottomNav.appendChild(div);
            });
        }

        // 3. LOGIQUE D'AFFICHAGE SELON LE FORMAT (L'Intelligence de Pages.)
        function switchFormat(format) {
            currentMode = format;
            currentPageIndex = 0;
            const data = availableApps[format];
            
            document.getElementById('appTitle').innerText = data.titre;

            // Mise à jour visuelle du menu
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(document.getElementById(`nav-${format}`)) document.getElementById(`nav-${format}`).classList.add('active');

            // Génération du HTML selon le paramètre "format" du JSON
            if (format === 'post') {
                // Flux vertical
                currentPages = [generatePostsHTML(data.items)];
                pageCounter.style.display = 'none';
            } else if (format === 'bd') {
                // Planches d'images pleines
                document.documentElement.setAttribute('data-theme', 'nuit'); // Force Dark mode pour BD
                currentPages = data.items.map(item => `
                    <div class="fmt-bd" style="height:100%; position:relative;">
                        ${item.image ? `<img src="${item.image}">` : ''}
                        ${item.text ? `<div class="bd-text">${item.text}</div>` : ''}
                    </div>
                `);
                pageCounter.style.display = 'block';
            } else {
                // Standard Livre / Magazine / Recette (Cartes avec texte formaté)
                currentPages = data.items.map(item => `
                    <div class="fmt-text">
                        ${item.category ? `<h3>${item.category}</h3>` : ''}
                        <h2>${item.title}</h2>
                        ${item.image ? `<img src="${item.image}">` : ''}
                        ${item.text ? `<p>${item.text.replace(/\n/g, '<br>')}</p>` : ''}
                    </div>
                `);
                pageCounter.style.display = 'block';
            }
            
            initialRender();
        }

        function generatePostsHTML(items) {
            let html = '<div class="post-feed">';
            items.forEach(post => {
                html += `
                    <div class="post-card">
                        <div class="post-meta"><span style="color:var(--text-primary); font-weight:600; text-transform:uppercase;">${post.category || 'Info'}</span></div>
                        <div class="post-title">${post.title || ''}</div>
                        ${post.image ? `<img src="${post.image}" style="width:100%; border-radius:10px; margin-bottom:15px;">` : ''}
                        <div style="font-family:'Inter'; color:var(--text-secondary); line-height:1.6;">${post.text ? post.text.replace(/\n/g, '<br>') : ''}</div>
                    </div>`;
            });
            return html + '</div>';
        }

        // 4. MOTEUR DE TRANSITION PAGES
        function initialRender() { 
            const card = activeCard === 'A' ? pageCardA : pageCardB;
            card.innerHTML = currentPages[currentPageIndex] || ""; 
            card.scrollTop = 0;
            
            pageCardA.className = activeCard === 'A' ? 'page-card page-active' : 'page-card'; 
            pageCardB.className = activeCard === 'B' ? 'page-card page-active' : 'page-card'; 
            pageCardA.style.display = activeCard === 'A' ? 'flex' : 'none';
            pageCardB.style.display = activeCard === 'B' ? 'flex' : 'none';
            
            if(currentMode !== 'post') pageCounter.textContent = `${currentPageIndex + 1} / ${currentPages.length}`; 
        } 
        
        function animateTransition(direction) { 
            if (currentMode === 'post' || isAnimating || currentPages.length === 0) return; 
            if (direction === 'next' && currentPageIndex >= currentPages.length - 1) return; 
            if (direction === 'prev' && currentPageIndex <= 0) return; 
            
            isAnimating = true; 
            const oldCard = activeCard === 'A' ? pageCardA : pageCardB; 
            const newCard = activeCard === 'A' ? pageCardB : pageCardA; 
            const newIndex = direction === 'next' ? currentPageIndex + 1 : currentPageIndex - 1; 
            
            newCard.innerHTML = currentPages[newIndex]; 
            newCard.scrollTop = 0;
            
            oldCard.classList.remove('page-active'); 
            newCard.style.display = 'flex'; 
            newCard.classList.remove('page-before', 'page-after', 'page-slide-out-left', 'page-slide-out-right'); 
            
            if (direction === 'next') { 
                oldCard.classList.add('page-slide-out-left'); 
                newCard.classList.add('page-after'); 
                void newCard.offsetWidth; 
                newCard.classList.remove('page-after'); 
                newCard.classList.add('page-active'); 
            } else { 
                oldCard.classList.add('page-slide-out-right'); 
                newCard.classList.add('page-before'); 
                void newCard.offsetWidth; 
                newCard.classList.remove('page-before'); 
                newCard.classList.add('page-active'); 
            } 
            
            setTimeout(() => { 
                oldCard.style.display = 'none'; 
                oldCard.classList.remove('page-slide-out-left', 'page-slide-out-right'); 
                activeCard = activeCard === 'A' ? 'B' : 'A'; 
                currentPageIndex = newIndex; 
                pageCounter.textContent = `${currentPageIndex + 1} / ${currentPages.length}`; 
                isAnimating = false; 
            }, 350); 
        } 
        
        // Tactile
        const stage = document.getElementById('readerStage');
        stage.addEventListener('touchstart', e => { if(isAnimating) return; touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive: true}); 
        stage.addEventListener('touchend', e => { 
            if (isAnimating || currentMode === 'post') return; 
            const deltaX = e.changedTouches[0].clientX - touchStartX; 
            const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
            if(deltaY > 50) return; // Si on scrolle verticalement, on n'anime pas
            if (deltaX < -50) animateTransition('next'); else if (deltaX > 50) animateTransition('prev'); 
        }); 

        function cycleTheme() { 
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'creme' ? 'nuit' : 'creme');
        } 
        
        window.onload = loadContent;
    </script> 
</body> 
</html>
