<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Play TV</title>
    <!-- Version du script ajustée à 10.0 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@10.0"></script>
    <style>
        :root {
            --bg-color: #000000;
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --black-70: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* --- UI AUTO-HIDE CLASS --- */
        .ui-element {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 10;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* --- GAUCHE : LISTE DES CHAINES --- */
        #channels-container {
            position: absolute;
            top: 0; left: 0;
            width: 300px; height: 100%;
            background: var(--black-70); /* Bande Vertical Noire, Transparent à 70% */
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 20px 10px;
            box-sizing: border-box;
            overflow-y: auto;
            transform: translateX(0);
        }

        #channels-container.ui-hidden {
            transform: translateX(-100%);
        }

        #channels-container::-webkit-scrollbar { display: none; }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .channel-card img {
            width: 40px; height: 30px;
            object-fit: contain;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .channel-name {
            font-size: 12px; /* Petit police */
            font-weight: bold;
        }

        /* Effet ZOOM et VITRÉ sur le focus */
        .channel-card.focused {
            transform: scale(1.1); /* ZOOM */
            background: var(--glass-bg);
            backdrop-filter: blur(5px); /* Effet Vitré */
            border-color: var(--accent-neon);
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Indicateur central CH.XX */
        #center-channel-indicator {
            position: absolute;
            left: 320px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* --- HAUT DROITE : HEURE ET CHAINE --- */
        #top-right-info {
            position: absolute;
            top: 20px; right: 30px;
            text-align: right;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-neon);
        }
        #clock { font-size: 24px; font-weight: bold; }
        #top-channel { font-size: 14px; color: var(--text-secondary); }

        /* --- DROITE : VOLUME BAR --- */
        #volume-container {
            position: absolute;
            right: 30px; top: 50%;
            transform: translateY(-50%);
            width: 30px; height: 200px;
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 5px;
            box-sizing: border-box;
        }
        #volume-fill {
            width: 100%;
            height: 50%; /* Modifié dynamiquement */
            background: var(--accent-neon);
            border-radius: 10px;
            transition: height 0.2s ease;
        }

        /* --- BAS : INFO BAR --- */
        #bottom-info {
            position: absolute;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: transparent; /* Arrière plan transparent */
            text-align: left;
        }
        #bottom-title {
            font-size: 20px; font-weight: bold; margin-bottom: 5px;
            text-shadow: 1px 1px 3px #000;
        }
        #bottom-epg {
            font-size: 14px; color: var(--text-secondary); margin-bottom: 10px;
            text-shadow: 1px 1px 3px #000;
        }
        .progress-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        .progress-bar-fill {
            width: 40%; /* Simulée */
            height: 100%;
            background: var(--accent-neon);
            border-radius: 3px;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 3;
            display: none;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="loader"></div>
        <video id="video" autoplay playsinline loop muted></video>
    </div>

    <!-- UI Elements -->
    <div id="channels-container" class="ui-element"></div>
    
    <div id="center-channel-indicator" class="ui-element">CH.1</div>

    <div id="top-right-info" class="ui-element">
        <div id="clock">00:00</div>
        <div id="top-channel">CHAINE 1</div>
    </div>

    <div id="volume-container" class="ui-element">
        <div id="volume-fill"></div>
    </div>

    <div id="bottom-info" class="ui-element">
        <div id="bottom-title">Nom de la Chaîne</div>
        <div id="bottom-epg">Programme EPG Actuel...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/XcaliBuild/live-player/refs/heads/main/FreeSportTV.m3u";
        
        let channels = [];
        let currentIndex = 0;
        let hideTimeout;
        let hls = null;
        
        const video = document.getElementById('video');
        const container = document.getElementById('channels-container');
        const loader = document.getElementById('loader');
        const uiElements = document.querySelectorAll('.ui-element');

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            await loadM3U();
            resetHideTimeout();
            
            video.addEventListener('waiting', () => loader.style.display = 'block');
            video.addEventListener('playing', () => {
                loader.style.display = 'none';
            });
            video.addEventListener('loadstart', () => loader.style.display = 'block');
            
            // Sync volume visuel avec la vidéo
            video.volume = 0.5;
            updateVolumeUI();
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }

        function resetHideTimeout() {
            showUI();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideUI(); }, 4000); // Auto-hide après 4s
        }

        function showUI() {
            uiElements.forEach(el => el.classList.remove('ui-hidden'));
        }
        function hideUI() {
            uiElements.forEach(el => el.classList.add('ui-hidden'));
        }

        window.addEventListener('click', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);
        window.addEventListener('mousemove', resetHideTimeout);

        async function loadM3U() {
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let currentChannel = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const name = line.split(',')[1] || "";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const groupMatch = line.match(/group-title="([^"]+)"/);

                        currentChannel = {
                            name: name.trim(),
                            logo: logoMatch ? logoMatch[1] : "",
                            group: groupMatch ? groupMatch[1] : "",
                            url: ""
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                });

                if (channels.length > 0) {
                    buildUI();
                    setFocus(0);
                    playChannel(0);
                }
            } catch (err) {
                console.error("Erreur M3U:", err);
            }
        }

        function buildUI() {
            container.innerHTML = '';
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card`;
                card.id = `channel-${index}`;
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:40px;height:30px;background:rgba(255,255,255,0.08);border-radius:4px;"></div>`;

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${channel.name}</div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setFocus(index);
                    playChannel(index);
                    resetHideTimeout();
                });

                container.appendChild(card);
            });
        }

        function setFocus(index) {
            const cards = document.querySelectorAll('.channel-card');
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');
            
            currentIndex = index;
            const activeCard = cards[currentIndex];
            if(activeCard) {
                activeCard.classList.add('focused');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Met à jour les infos à l'écran
            const channel = channels[index];
            const chNum = index + 1;
            document.getElementById('center-channel-indicator').innerText = `CH.${chNum}`;
            document.getElementById('top-channel').innerText = `CHAINE ${chNum}`;
            document.getElementById('bottom-title').innerText = channel.name;
            document.getElementById('bottom-epg').innerText = channel.group || "Programme en cours...";
        }

        function playChannel(index) {
            const channel = channels[index];
            if (!channel) return;

            loader.style.display = 'block';

            if (hls) { hls.destroy(); }

            if (Hls.isSupported()) {
                hls = new Hls({ maxBufferLength: 10, lowLatencyMode: true });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { 
                    video.muted = false; // Demute au lancement
                    video.play().catch(() => {}); 
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { 
                    video.muted = false;
                    video.play(); 
                });
            }
        }

        // --- GESTION DU VOLUME ---
        function updateVolumeUI() {
            const fill = document.getElementById('volume-fill');
            fill.style.height = `${video.volume * 100}%`;
        }

        window.addEventListener('keydown', (e) => {
            resetHideTimeout();
            
            // Navigation Liste
            if (e.key === 'ArrowUp') {
                if (currentIndex > 0) { setFocus(currentIndex - 1); }
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                if (currentIndex < channels.length - 1) { setFocus(currentIndex + 1); }
                e.preventDefault();
            } else if (e.key === 'Enter') {
                playChannel(currentIndex);
                e.preventDefault();
            } 
            // Gestion Volume (+ / -)
            else if (e.key === '+' || e.key === 'ArrowRight') {
                video.volume = Math.min(video.volume + 0.1, 1);
                updateVolumeUI();
                e.preventDefault();
            } else if (e.key === '-' || e.key === 'ArrowLeft') {
                video.volume = Math.max(video.volume - 0.1, 0);
                updateVolumeUI();
                e.preventDefault();
            }
        });

        init();
    </script>
</body>
</html>
