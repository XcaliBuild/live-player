<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Play TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg-color: #000000;
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --black-70: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* --- LOGIQUE AUTO-HIDE INTERFACE GLOBALE --- */
        .ui-element {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 10;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* --- GAUCHE : LISTE DES CHAINES STYLE CROQUIS --- */
        #channels-container {
            position: absolute;
            top: 0; left: 0;
            width: 320px; height: 100%;
            background: var(--black-70); /* Bande noire transparente à 70% */
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 30px 15px;
            box-sizing: border-box;
            overflow-y: auto;
            transform: translateX(0);
        }

        #channels-container.ui-hidden {
            transform: translateX(-100%);
        }

        #channels-container::-webkit-scrollbar { display: none; }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
        }

        .channel-card img {
            width: 45px; height: 32px;
            object-fit: contain;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            white-space: nowrap;
        }

        .channel-name {
            font-size: 12px; /* Petite police */
            font-weight: bold;
        }

        /* EFFET ZOOM ET VITRÉ AU FOCUS DE LA TELECOMMANDE */
        .channel-card.focused {
            transform: scale(1.08); /* Zoom */
            background: var(--glass-bg);
            backdrop-filter: blur(8px); /* Effet Vitré */
            border-color: var(--accent-neon);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .channel-card.active .channel-name {
            color: var(--accent-neon);
        }

        /* Indicateur central CH.XX */
        #center-channel-indicator {
            position: absolute;
            left: 350px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* --- HAUT DROITE : HEURE ET CHAINE --- */
        #top-right-info {
            position: absolute;
            top: 25px; right: 35px;
            text-align: right;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-neon);
        }
        #clock { font-size: 26px; font-weight: bold; }
        #top-channel { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

        /* --- DROITE : JAUGE DE VOLUME INDÉPENDANTE --- */
        #volume-container {
            position: absolute;
            right: 40px; top: 50%;
            transform: translateY(-50%);
            width: 45px; height: 220px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 5px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.3s ease;
            opacity: 0; /* Totalement masqué par défaut */
            pointer-events: none;
        }
        #volume-container.volume-visible {
            opacity: 1; /* Apparaît uniquement lors des touches de volume */
        }
        #volume-text {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-neon);
        }
        .volume-track {
            width: 6px;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #volume-fill {
            width: 100%;
            height: 50%;
            background: var(--accent-neon);
            border-radius: 3px;
            transition: height 0.1s ease;
        }

        /* --- BAS : INFO BAR --- */
        #bottom-info {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 75%;
            background: transparent; /* Arrière-plan transparent */
            text-align: left;
        }
        #bottom-title {
            font-size: 22px; font-weight: bold; margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
        }
        #bottom-epg {
            font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;
            text-shadow: 1px 1px 3px #000;
        }
        .progress-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }
        .progress-bar-fill {
            width: 40%; /* Simulation de progression */
            height: 100%;
            background: var(--accent-neon);
            border-radius: 3px;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 3;
            display: block;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="video-container">
        <div id="loader"></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="channels-container" class="ui-element"></div>
    <div id="center-channel-indicator" class="ui-element">CH.1</div>

    <div id="top-right-info" class="ui-element">
        <div id="clock">00:00</div>
        <div id="top-channel">CHAINE 1</div>
    </div>

    <div id="bottom-info" class="ui-element">
        <div id="bottom-title">Chargement...</div>
        <div id="bottom-epg">Veuillez patienter...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div id="volume-container">
        <div id="volume-text">50%</div>
        <div class="volume-track">
            <div id="volume-fill"></div>
        </div>
    </div>

    <script>
        const m3uUrl = "https://raw.githubusercontent.com/XcaliBuild/live-player/refs/heads/main/FreeSportTV.m3u";
        
        let channels = [];
        let currentIndex = 0;
        let hideTimeout;
        let volumeTimeout;
        let hls = null;
        
        const video = document.getElementById('video');
        const container = document.getElementById('channels-container');
        const loader = document.getElementById('loader');
        const uiElements = document.querySelectorAll('.ui-element');
        const volumeContainer = document.getElementById('volume-container');

        async function init() {
            updateClock();
            setInterval(updateClock, 1000); // Horloge en temps réel fixe
            await loadM3U();
            resetHideTimeout();
            
            video.addEventListener('waiting', () => loader.style.display = 'block');
            video.addEventListener('playing', () => loader.style.display = 'none');
            video.addEventListener('loadstart', () => loader.style.display = 'block');
            
            // Initialisation audio sécurisée
            video.volume = 0.5;
            updateVolumeUI();
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }

        function resetHideTimeout() {
            showUI();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideUI(); }, 4000);
        }

        function showUI() { uiElements.forEach(el => el.classList.remove('ui-hidden')); }
        function hideUI() { uiElements.forEach(el => el.classList.add('ui-hidden')); }

        // Affichage exclusif de la jauge de volume
        function triggerVolumeUI() {
            volumeContainer.classList.add('volume-visible');
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => {
                volumeContainer.classList.remove('volume-visible');
            }, 2000); // Disparaît après 2 secondes d'inactivité sur le volume
        }

        window.addEventListener('click', resetHideTimeout);
        window.addEventListener('mousemove', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);

        async function loadM3U() {
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let currentChannel = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const name = line.split(',')[1] || "";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const groupMatch = line.match(/group-title="([^"]+)"/);

                        currentChannel = {
                            name: name.trim(),
                            logo: logoMatch ? logoMatch[1] : "",
                            group: groupMatch ? groupMatch[1] : "",
                            url: ""
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                });

                if (channels.length > 0) {
                    buildUI();
                    setFocus(0);
                    playChannel(0);
                }
            } catch (err) {
                console.error("Erreur de parsing M3U:", err);
            }
        }

        function buildUI() {
            container.innerHTML = '';
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card`;
                card.id = `channel-${index}`;
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:45px;height:32px;background:rgba(255,255,255,0.08);border-radius:4px;"></div>`;

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${channel.name}</div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setFocus(index);
                    playChannel(index);
                    resetHideTimeout();
                });

                container.appendChild(card);
            });
        }

        function setFocus(index) {
            const cards = document.querySelectorAll('.channel-card');
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');
            
            currentIndex = index;
            const activeCard = cards[currentIndex];
            if(activeCard) {
                activeCard.classList.add('focused');
                activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            const channel = channels[index];
            const chNum = index + 1;
            document.getElementById('center-channel-indicator').innerText = `CH.${chNum}`;
            document.getElementById('top-channel').innerText = `CHAINE ${chNum}`;
            document.getElementById('bottom-title').innerText = channel.name;
            document.getElementById('bottom-epg').innerText = channel.group || "Aucune information de programme";
        }

        function playChannel(index) {
            const channel = channels[index];
            if (!channel) return;

            loader.style.display = 'block';

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            const currentCard = document.getElementById(`channel-${index}`);
            if(currentCard) currentCard.classList.add('active');

            if (hls) { hls.destroy(); }

            // Script HLS renforcé pour contourner les erreurs réseau/décodage
            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    lowLatencyMode: true,
                    backBufferLength: 60
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {
                        // Forcer la lecture si le navigateur bloque l'audio initialement
                        video.muted = true;
                        video.play();
                    });
                });
                
                // Système Auto-Recover face aux erreurs de flux m3u8
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                loader.style.display = 'none';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        function updateVolumeUI() {
            const fill = document.getElementById('volume-fill');
            const txt = document.getElementById('volume-text');
            const pct = Math.round(video.volume * 100);
            fill.style.height = `${pct}%`;
            txt.innerText = `${pct}%`;
        }

        // --- COMMANDES CLAVIER & TÉLÉCOMMANDE ANDROID TV ---
        window.addEventListener('keydown', (e) => {
            // Flèches Haut/Bas contrôlent la navigation des chaînes
            if (e.key === 'ArrowUp') {
                resetHideTimeout();
                if (currentIndex > 0) { setFocus(currentIndex - 1); }
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                resetHideTimeout();
                if (currentIndex < channels.length - 1) { setFocus(currentIndex + 1); }
                e.preventDefault();
            } else if (e.key === 'Enter') {
                resetHideTimeout();
                playChannel(currentIndex);
                e.preventDefault();
            } 
            // Flèches Gauche/Droite contrôlent exclusivement le Volume (sans afficher le reste)
            else if (e.key === '+' || e.key === 'ArrowRight') {
                triggerVolumeUI();
                video.volume = Math.min(video.volume + 0.05, 1);
                updateVolumeUI();
                e.preventDefault();
            } else if (e.key === '-' || e.key === 'ArrowLeft') {
                triggerVolumeUI();
                video.volume = Math.max(video.volume - 0.05, 0);
                updateVolumeUI();
                e.preventDefault();
            }
        });

        init();
    </script>
</body>
</html>
