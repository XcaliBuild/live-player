    <style>
        :root {
            --bg-color: #000000;
            --accent-neon: #39ff14; /* Vert Fluo */
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --black-70: rgba(0, 0, 0, 0.7);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overflow: hidden;
            height: 100%; width: 100%;
        }

        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000000;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000000;
        }

        /* --- INTERFACE AUTO-HIDE GLOBALE --- */
        .ui-element {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 10;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none;
        }

        /* --- ZONE DE NAVIGATION GAUCHE --- */
        #sidebar-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 350px; height: 100%;
            background: var(--black-70);
            z-index: 10;
            overflow: hidden;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        #sidebar-wrapper.ui-hidden {
            transform: translateX(-100%);
        }

        /* CURSEUR FIXE AU CENTRE (CRISTAL ULTRA-NET) */
        #fixed-cursor {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 330px;
            height: 70px;
            border: 2px solid var(--accent-neon);
            background: var(--glass-bg);
            border-radius: 14px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.45), 
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: opacity 0.3s ease;
        }

        /* CONTENEUR DE LA LISTE */
        #channels-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        #channels-container::-webkit-scrollbar { display: none; }

        /* STYLE DES LIGNES PAR DÉFAUT */
        .channel-card {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 54px;
            height: 54px;
            padding: 5px 10px;
            box-sizing: border-box;
            border-radius: 8px;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease, color 0.25s ease;
            opacity: 0.4; 
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 6; 
        }

        .channel-card img {
            width: 30px; height: 20px;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            transition: all 0.25s ease;
        }

        .channel-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* EFFET MAGNIFIER (GROS ZOOM NET) */
        .channel-card.focused {
            transform: scale(1.25);
            transform-origin: left center;
            opacity: 1;
            color: #ffffff;
            font-weight: bold;
        }
        .channel-card.focused img {
            width: 44px; height: 30px;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .channel-card.active-playing .channel-name {
            color: var(--accent-neon);
        }

        /* Indicateur central CH.XX */
        #center-channel-indicator {
            position: absolute;
            left: 370px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* HAUT DROITE */
        #top-right-info {
            position: absolute;
            top: 25px; right: 35px;
            text-align: right;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border-right: 4px solid var(--accent-neon);
        }
        #clock { font-size: 26px; font-weight: bold; }
        #top-channel { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

        /* DROITE : VOLUME */
        #volume-container {
            position: absolute;
            right: 40px; top: 50%;
            transform: translateY(-50%);
            width: 45px; height: 220px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 5px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        #volume-container.volume-visible {
            opacity: 1;
        }
        #volume-text {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-neon);
        }
        .volume-track {
            width: 6px;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #volume-fill {
            width: 100%;
            height: 50%;
            background: var(--accent-neon);
            border-radius: 3px;
            transition: height 0.1s ease;
        }

        /* BAS : INFO BAR */
        #bottom-info {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 75%;
            background: transparent;
            text-align: left;
        }
        #bottom-title {
            font-size: 22px; font-weight: bold; margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
        }
        #bottom-epg {
            font-size: 14px; color: var(--text-secondary); margin-bottom: 12px;
            text-shadow: 1px 1px 3px #000;
        }
        .progress-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
        }
        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: var(--accent-neon);
            border-radius: 3px;
        }

        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-neon);
            animation: spin 1s linear infinite;
            z-index: 3;
            display: none;
        }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>

        let channels = [];
        let currentIndex = 0;
        let hideTimeout;
        let volumeTimeout;
        let autoplayTimeout;
        let hls = null;
        
        const video = document.getElementById('video');
        const container = document.getElementById('channels-container');
        const wrapper = document.getElementById('sidebar-wrapper');
        const loader = document.getElementById('loader');
        const uiElements = document.querySelectorAll('.ui-element');
        const volumeContainer = document.getElementById('volume-container');

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            
            // On charge directement la variable interne, fini le fetch externe !
            loadM3U();
            
            resetHideTimeout();
            
            video.addEventListener('waiting', () => loader.style.display = 'block');
            video.addEventListener('playing', () => loader.style.display = 'none');
            video.addEventListener('loadstart', () => loader.style.display = 'block');
            
            video.volume = 0.5;
            updateVolumeUI();
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }

        function resetHideTimeout() {
            showUI();
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => { hideUI(); }, 4000);
        }

        function showUI() { wrapper.classList.remove('ui-hidden'); uiElements.forEach(el => { if(el !== wrapper) el.classList.remove('ui-hidden'); }); }
        function hideUI() { wrapper.classList.add('ui-hidden'); uiElements.forEach(el => { if(el !== wrapper) el.classList.add('ui-hidden'); }); }

        function triggerVolumeUI() {
            volumeContainer.classList.add('volume-visible');
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => { volumeContainer.classList.remove('volume-visible'); }, 2000);
        }

        window.addEventListener('click', resetHideTimeout);
        window.addEventListener('mousemove', resetHideTimeout);
        window.addEventListener('touchstart', resetHideTimeout);

        function loadM3U() {
            try {
                // Utilisation de la liste incluse dans le code
                const lines = m3uData.split('\n');
                let currentChannel = null;

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const name = line.split(',')[1] || "";
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const groupMatch = line.match(/group-title="([^"]+)"/);

                        currentChannel = {
                            name: name.trim(),
                            logo: logoMatch ? logoMatch[1] : "",
                            group: groupMatch ? groupMatch[1] : "",
                            url: ""
                        };
                    } else if (line.startsWith('http') && currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                });

                if (channels.length > 0) {
                    buildUI();
                    adjustScrollPadding();
                    setFocus(0, true);
                } else {
                    document.getElementById('bottom-title').innerText = "Aucune chaîne trouvée";
                    document.getElementById('bottom-epg').innerText = "Vérifiez le format M3U.";
                }
            } catch (err) {
                console.error("Erreur de traitement M3U:", err);
            }
        }

        function buildUI() {
            container.innerHTML = '';
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card`;
                card.id = `channel-${index}`;
                
                const logoHtml = channel.logo ? `<img src="${channel.logo}" onerror="this.style.display='none'">` : `<div style="width:30px;height:20px;background:rgba(255,255,255,0.08);border-radius:3px;"></div>`;

                card.innerHTML = `
                    ${logoHtml}
                    <div class="card-info">
                        <div class="channel-name">${channel.name}</div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setFocus(index, true);
                    resetHideTimeout();
                });

                container.appendChild(card);
            });
        }

        function adjustScrollPadding() {
            const halfContainerHeight = container.clientHeight / 2;
            const halfCardHeight = 27; 
            const paddingValue = halfContainerHeight - halfCardHeight;
            container.style.paddingTop = `${paddingValue}px`;
            container.style.paddingBottom = `${paddingValue}px`;
        }

        function setFocus(index, immediatePlay = false) {
            const cards = document.querySelectorAll('.channel-card');
            if(cards[currentIndex]) cards[currentIndex].classList.remove('focused');
            
            currentIndex = index;
            const activeCard = cards[currentIndex];
            if(activeCard) {
                activeCard.classList.add('focused');
                
                const containerHalfHeight = container.clientHeight / 2;
                const cardHalfHeight = activeCard.clientHeight / 2;
                container.scrollTop = (activeCard.offsetTop - container.offsetTop) - containerHalfHeight + cardHalfHeight;
            }

            const channel = channels[index];
            const chNum = index + 1;
            document.getElementById('center-channel-indicator').innerText = `CH.${chNum}`;
            document.getElementById('top-channel').innerText = `CHAINE ${chNum}`;
            document.getElementById('bottom-title').innerText = channel.name;
            document.getElementById('bottom-epg').innerText = channel.group || "Prêt";

            clearTimeout(autoplayTimeout);
            if (immediatePlay) {
                playChannel(index);
            } else {
                autoplayTimeout = setTimeout(() => {
                    playChannel(index);
                }, 500);
            }
        }

        function playChannel(index) {
            const channel = channels[index];
            if (!channel) return;

            loader.style.display = 'block';

            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-playing'));
            const currentCard = document.getElementById(`channel-${index}`);
            if(currentCard) currentCard.classList.add('active-playing');

            if (hls) { hls.destroy(); }

            // Son activé d'office !
            video.muted = false;

            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 15,
                    maxMaxBufferLength: 30,
                    lowLatencyMode: true
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch((err) => {
                        console.log("Lecture bloquée par le navigateur, forçage avec le son coupé temporairement.");
                        video.muted = true; 
                        video.play().then(() => {
                            setTimeout(() => { video.muted = false; }, 100);
                        });
                    });
                });
                
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                loader.style.display = 'none';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => { 
                    video.play().catch(() => {
                        video.muted = true;
                        video.play();
                    });
                });
            }
        }

        function updateVolumeUI() {
            const fill = document.getElementById('volume-fill');
            const txt = document.getElementById('volume-text');
            const pct = Math.round(video.volume * 100);
            fill.style.height = `${pct}%`;
            txt.innerText = `${pct}%`;
        }

        window.addEventListener('resize', adjustScrollPadding);

        // --- MANETTE & CLAVIER : BOUCLE INFINIE ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') {
                resetHideTimeout();
                if (currentIndex > 0) { 
                    setFocus(currentIndex - 1, false); 
                } else {
                    setFocus(channels.length - 1, false);
                }
                e.preventDefault();
            } else if (e.key === 'ArrowDown') {
                resetHideTimeout();
                if (currentIndex < channels.length - 1) { 
                    setFocus(currentIndex + 1, false); 
                } else {
                    setFocus(0, false);
                }
                e.preventDefault();
            } else if (e.key === 'Enter') {
                resetHideTimeout();
                playChannel(currentIndex);
                e.preventDefault();
            } 
            else if (e.key === '+' || e.key === 'ArrowRight') {
                triggerVolumeUI();
                video.muted = false;
                video.volume = Math.min(video.volume + 0.05, 1);
                updateVolumeUI();
                e.preventDefault();
            } else if (e.key === '-' || e.key === 'ArrowLeft') {
                triggerVolumeUI();
                video.volume = Math.max(video.volume - 0.05, 0);
                updateVolumeUI();
                e.preventDefault();
            }
        });

        init();
    </script>
</body>
</html>
